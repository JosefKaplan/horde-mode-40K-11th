<style>
:root {
  /* Necron palette: gunmetal neutrals, glow green = the Horde's turn, brass = the players' turn,
     blue = CP, violet = SP, crimson = Misery and errors. Keep the three token blocks in sync. */
  --bg: #e8edea;
  --surface: #ffffff;
  --surface-2: #f2f6f3;
  --ink: #13201a;
  --muted: #55635c;
  --line: #cdd7d1;
  --horde: #0b7a4b;
  --horde-soft: #d2efe0;
  --ply: #86650b;
  --ply-soft: #f1e5bd;
  --cp: #1d6597;
  --cp-soft: #dae9f5;
  --sp: #6a3fb0;
  --sp-soft: #e8dff6;
  --bad: #b3261e;
  --bad-soft: #f8dedb;
  --warn: #9a5600;
  --warn-soft: #fbecd6;
  --good: #0b7a4b;
  --on-turn: #ffffff;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b100e; --surface: #151c19; --surface-2: #1c2521; --ink: #e4ece7; --muted: #9aa8a1; --line: #2b3732;
    --horde: #4ee39a; --horde-soft: #12332a; --ply: #e2b64f; --ply-soft: #3a2f14;
    --cp: #6db4ea; --cp-soft: #15293a; --sp: #b597ec; --sp-soft: #2a2040;
    --bad: #f27a6e; --bad-soft: #40201d; --warn: #f1b45c; --warn-soft: #3a2b14; --good: #4ee39a; --on-turn: #07110c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b100e; --surface: #151c19; --surface-2: #1c2521; --ink: #e4ece7; --muted: #9aa8a1; --line: #2b3732;
  --horde: #4ee39a; --horde-soft: #12332a; --ply: #e2b64f; --ply-soft: #3a2f14;
  --cp: #6db4ea; --cp-soft: #15293a; --sp: #b597ec; --sp-soft: #2a2040;
  --bad: #f27a6e; --bad-soft: #40201d; --warn: #f1b45c; --warn-soft: #3a2b14; --good: #4ee39a; --on-turn: #07110c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body), sans-serif; font-size: 15px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; --turn: var(--muted); --turn-soft: var(--surface-2);
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
body[data-who="horde"] { --turn: var(--horde); --turn-soft: var(--horde-soft); }
body[data-who="players"] { --turn: var(--ply); --turn-soft: var(--ply-soft); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--turn); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display), sans-serif; text-wrap: balance; margin: 0; }
p { margin: 0; }
b { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---------- Tracker ---------- */
.tracker {
  position: sticky; top: 0; z-index: 10; background: var(--surface);
  border-top: 4px solid var(--turn); border-bottom: 1px solid var(--line);
  padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 10px; display: grid; gap: 8px;
}
.tr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.who { font-family: var(--font-display), sans-serif; font-weight: 700; font-size: 17px; color: var(--turn); letter-spacing: .02em; }
.round { font-family: var(--font-display), sans-serif; font-weight: 600; font-size: 14px; color: var(--muted); }
.round b { color: var(--ink); font-size: 18px; }
.mode-tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 2px 6px; margin-left: 6px; }
.pchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.pchips::-webkit-scrollbar { display: none; }
.pchip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.pchip .cp { color: var(--cp); font-weight: 600; }
.pchip .sp { color: var(--sp); font-weight: 600; }
.tr-nav { display: flex; gap: 8px; align-items: stretch; }
.navbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 8px 14px; font-weight: 600; min-width: 48px; }
.navbtn.next { background: var(--turn); color: var(--on-turn); border-color: var(--turn); flex: 1 1 auto; }
.navbtn:disabled { opacity: .4; cursor: default; }
.pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.pill.horde { border-color: var(--horde); }
.pill.players { border-color: var(--ply); }
.pill[aria-current="step"] { background: var(--turn); color: var(--on-turn); border-color: var(--turn); font-weight: 600; }
.pill.done { opacity: .55; }

/* ---------- Layout ---------- */
main { padding: 12px 16px; display: grid; gap: 12px; max-width: 760px; margin: 0 auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.panel > h2 { font-size: 18px; }
.panel > h3 { font-size: 15px; }
.panel.turnbar { border-left: 5px solid var(--turn); }
.sub { color: var(--muted); font-size: 13px; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: start; }
.tick { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 0; font-size: 14px; line-height: 1; }
.tick[aria-pressed="true"] { background: var(--turn); border-color: var(--turn); color: var(--on-turn); }
.item.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.done .txt * { display: inline; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab { border: 0; background: transparent; padding: 9px 2px 8px; display: grid; gap: 2px; justify-items: center; font-size: 12px; font-weight: 500; color: var(--muted); border-top: 3px solid transparent; }
.tab .ic { font-size: 18px; line-height: 1; }
.tab[aria-selected="true"] { color: var(--ink); border-top-color: var(--turn); font-weight: 600; }

/* ---------- Controls ---------- */
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 8px 12px; font-weight: 500; }
.btn.primary { background: var(--turn); color: var(--on-turn); border-color: var(--turn); font-weight: 600; }
.btn.danger { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface-2); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 18px; line-height: 1; }
.stepper .num { font-family: var(--font-display), sans-serif; font-weight: 700; font-size: 22px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper.cp .num { color: var(--cp); }
.stepper.sp .num { color: var(--sp); }
input[type="text"], input[type="number"], select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
input[type="number"] { width: 5.5em; }
select { max-width: 100%; }
label.field { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
label.field .seg { justify-self: start; }
.shoplist { display: grid; gap: 6px; }
.shoprow { border: 1px solid var(--line); border-left: 4px solid var(--ply); border-radius: 8px; background: var(--surface); padding: 6px 8px; display: grid; gap: 4px; }
.shoprow.blocked { opacity: .6; }
.shophead { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.shophead .ft { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.hordephase { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; }
.hordephase h3 { font-size: 15px; }
.shophead > .row { flex: 0 0 auto; }
.shophead label { display: inline-flex; gap: 4px; align-items: center; }
.shophead input[type="number"] { width: 3.6em; }
.shophead .btn { white-space: nowrap; }
.chip { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--line); }
.chip.good { background: var(--horde-soft); border-color: var(--horde); color: var(--good); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip.cp { background: var(--cp-soft); border-color: var(--cp); color: var(--cp); }
.chip.sp { background: var(--sp-soft); border-color: var(--sp); color: var(--sp); }
.note { background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.note.bad { background: var(--bad-soft); border-left-color: var(--bad); }
.note.good { background: var(--horde-soft); border-left-color: var(--horde); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface-2); }
summary { cursor: pointer; font-weight: 500; }

/* ---------- Game cards ---------- */
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.gcard { border: 1px solid var(--line); border-top: 5px solid var(--cardc, var(--muted)); border-radius: 10px; background: var(--surface); padding: 8px 10px 10px; display: grid; gap: 4px; align-content: start; }
.gcard .hd { display: flex; gap: 8px; align-items: baseline; }
.gcard .no { font-family: var(--font-display), sans-serif; font-weight: 700; color: var(--cardc, var(--muted)); font-size: 18px; }
.gcard .nm { font-family: var(--font-display), sans-serif; font-weight: 600; font-size: 16px; }
.gcard .ft { display: flex; gap: 4px; flex-wrap: wrap; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.gcard.misery { --cardc: var(--bad); }
.gcard.secondary { --cardc: var(--cp); }
.gcard.secret { --cardc: var(--sp); }
.gcard.back { background: repeating-linear-gradient(135deg, var(--surface-2) 0 8px, var(--surface) 8px 16px); text-align: center; align-content: center; min-height: 96px; color: var(--muted); }
.gcard.big { border-width: 2px; border-top-width: 6px; }

/* ---------- Horde ---------- */
.zone { border: 1px solid var(--line); border-left: 5px solid var(--horde); border-radius: 10px; background: var(--surface); padding: 10px 12px; display: grid; gap: 10px; }
.zone.done { border-left-color: var(--muted); }
.dice { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.die { width: 3.2em; text-align: center; }
.calc { font-family: var(--font-display), sans-serif; font-weight: 600; }
.calc .total { font-size: 22px; color: var(--horde); }
.slot { border: 1px dashed var(--horde); border-radius: 8px; padding: 8px; display: grid; gap: 8px; background: var(--surface-2); }
.opt { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 10px; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.opt .rk { font-family: var(--font-display), sans-serif; font-weight: 700; font-size: 18px; color: var(--horde); text-align: center; }
.opt.na { opacity: .6; }
.opt .nm { font-weight: 600; overflow-wrap: anywhere; }
.reasons { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.draft { border: 2px solid var(--horde); border-radius: 8px; background: var(--surface); padding: 10px; display: grid; gap: 8px; }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: inherit; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
.linkbtn:hover { text-decoration-color: var(--turn); }
.wpn { border-top: 1px solid var(--line); padding: 4px 0; display: grid; gap: 2px; }
.wstats { display: flex; flex-wrap: wrap; gap: 2px 10px; font-family: var(--font-display), sans-serif; font-weight: 600; font-size: 13px; color: var(--muted); }
table.stats { font-family: var(--font-display), sans-serif; font-size: 14px; width: auto; }
table.stats th { color: var(--muted); font-weight: 600; font-size: 12px; text-align: center; padding: 2px 6px; }
table.stats td { text-align: center; font-weight: 600; padding: 2px 6px; }
.bul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
details > .bul { margin-top: 6px; }
.roster { display: grid; gap: 6px; }
.rost { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface-2); }

/* ---------- Sheet / toast ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--surface); width: min(100%, 520px); border-radius: 14px 14px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 85vh; overflow: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px); text-align: center; }
.toast[hidden] { display: none; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.log li { border-bottom: 1px solid var(--line); padding: 3px 0; }
</style>
</head>

}
/* Higher score = better. Collection fit first, then variety; aircraft and fortifications last (rules 4, designer's note:

function rankOptions(bracket, seed, s = state) {
  const list = SPAWN[s.setup.sheet][bracket] || [];
  const round = effRound(s);
  const ranked = list.map(raw => {
    const e = parseEntry(raw);
    const reasons = [];
    let score = 100;
    const missing = shortfalls(e, s);
    const available = missing.length === 0;
    const limited = Object.keys(e.need).some(k => s.collection[k] != null);
    if (!available) { score -= 1000; reasons.push({ kind: 'bad', text: 'Need ' + missing.map(m => m.missing + ' more ' + catalogName(m.key)).join(', ') }); }
    else if (limited) reasons.push({ kind: 'good', text: 'You have the models' });
    if (e.lastResort) { score -= 60; reasons.push({ kind: 'warn', text: e.lastResort + ': last resort' }); }
    const profile = hordeProfile(e.baseKey);
    if (profile && profile.deepStrike && round >= 2 && round <= 4) reasons.push({ kind: '', text: 'Deep Strike: starts in reserves' });
    if (e.placeholders.includes('transported unit')) reasons.push({ kind: '', text: 'Pick a passenger' });
    const onTable = s.horde.filter(h => h.baseKey === e.baseKey).length;
    const thisRound = s.horde.filter(h => h.baseKey === e.baseKey && h.round === round).length;
    if (onTable) { score -= 12 * Math.min(onTable, 4) + 18 * thisRound; reasons.push({ kind: 'warn', text: onTable + ' already on the table' }); }
    else reasons.push({ kind: 'good', text: 'New to the table' });

    return { raw, entry: e, score, reasons, available };

}

/* ---- Decks ---- */
function drawFrom(deck) {
  if (!deck.draw.length) { deck.draw = shuffle(deck.discard); deck.discard = []; }
  return deck.draw.length ? deck.draw.pop() : null;
}
function activateMisery(s, id) {
  const card = MIS[id];
  s.decks.misery.active.push(id);
  addLog(s, 'Misery: ' + card.name);
  switch (card.auto) {
    case 'extra-zone': s.zones.push(newZone(s, true)); break;
    case 'no-hard-feelings':
      if (s.players.length === 1) revealMisery(s, 2);
      else { const p = s.players[randInt(s.players.length)]; p.sp = 0; addLog(s, p.name + ' lost all SP'); }
      break;
    case 'lose5': s.players.forEach(p => { p.sp = Math.max(0, p.sp - 5); }); break;
    case 'draw2': revealMisery(s, 2); break;
    case 'clear-fortified': clearFortified(s); break;
    case 'fetters': {
      const most = Math.max(...s.players.map(p => p.sp));
      const tied = s.players.filter(p => p.sp === most);
      const victim = tied[randInt(tied.length)];
      victim.sp = Math.max(0, victim.sp - 4);
      addLog(s, victim.name + ' lost 4 SP');
      for (let i = 0; i < 3; i++) revealSecondary(s);
      break;
    }
    default: break;
  }
}
function revealMisery(s, count) {
  for (let i = 0; i < count; i++) {
    const id = drawFrom(s.decks.misery);
    if (!id) return;
    activateMisery(s, id);
  }
}
function forceMisery(s, id) {
  const deck = s.decks.misery;
  if (deck.active.includes(id)) return;
  deck.draw = deck.draw.filter(x => x !== id);
  deck.discard = deck.discard.filter(x => x !== id);
  activateMisery(s, id);
}
/* Fortified markers sit on objectives (rules 3.9). Teleporters, Razor Wire and Minefields are not fortified markers. */
function clearFortified(s) {

}
/* "Revealed after the Horde's Movement phase" (Calling Shots): any stage after h-move this round. */
function afterHordeMove(s) {
  const list = stagesFor(s.round, s);

}
function discardActiveMisery(s) {

}
/* Cards that say "if drawn in round 1, reveal another and shuffle this back" are handled here. */
function revealSecondary(s) {
  const deck = s.decks.secondary;
  for (let guard = 0; guard < 40; guard++) {
    const id = drawFrom(deck);
    if (!id) return null;
    const card = SEC[id];
    if (card.r1redraw && s.round <= 1) { deck.draw = shuffle([...deck.draw, id]); addLog(s, card.name + ' drawn in round 1: shuffled back'); continue; }
    if (card.afterHordeMoveRedraw && afterHordeMove(s)) { deck.draw = shuffle([...deck.draw, id]); addLog(s, card.name + ' revealed after the Horde Movement phase: shuffled back'); continue; }
    deck.active.push(id);

    return id;
  }

}
/* Discards without resolving: no reward, no punishment, nothing carries over. */
function discardSecondary(s, id) {
  const deck = s.decks.secondary;
  if (!deck.active.includes(id)) return;
  deck.active = deck.active.filter(x => x !== id);

}
function redrawSecondary(s, id) {

/* ---- Supply Points ---- */
function gainSP(s, playerIndex, amount) {
  const p = s.players[playerIndex];
  if (!p || amount <= 0) return 0;
  const cap = spCap(s);
  const gained = cap === Infinity ? amount : Math.max(0, Math.min(amount, cap - p.spRound));
  p.sp += gained; p.spRound += gained;
  if (gained < amount) addLog(s, p.name + ': Hard Mode SP cap, gained ' + gained + ' of ' + amount);
  return gained;
}
/* Gains that hit every player are doubled in a single-player game (rules 3.7). */
function gainAll(s, amount) {
  const factor = s.players.length === 1 ? 2 : 1;
  s.players.forEach((p, i) => gainSP(s, i, amount * factor));
}
const evalX = (expr, x) => expr === 'X' ? x : expr === 'X+1' ? x + 1 : expr === 'X*2' ? x * 2 : 0;

/* Turns a Secondary Mission's reward or punishment into state changes. Returns short lines for the log.
   who: the player picked for a 'pick' reward, or -1 when nobody triggered it (then fx.nobody replaces the grants). */
function applyFx(s, fx, x, cardId, who) {
  const out = [];
  const nobody = who === -1 && fx.nobody;
  if (nobody) out.push(...applyFx(s, fx.nobody, x, cardId));
  const ownerFor = mode => (mode === 'pick' && who >= 0 ? who : randInt(s.players.length));
  if (fx.sp) { gainAll(s, fx.sp); out.push('+' + fx.sp + ' SP each'); }
  if (fx.spx) { const v = evalX(fx.spx, x); gainAll(s, v); out.push('+' + v + ' SP each'); }
  if (fx.cp) { s.players.forEach(p => { p.cp += fx.cp; }); out.push('+' + fx.cp + ' CP each'); }
  if (fx.spLose) { s.players.forEach(p => { p.sp = Math.max(0, p.sp - fx.spLose); }); out.push('-' + fx.spLose + ' SP each'); }
  if (fx.misery) { s.carry.misery += fx.misery; out.push('+' + fx.misery + ' Misery next round'); }
  if (fx.miseryX) { s.carry.misery += x; out.push('+' + x + ' Misery next round'); }
  if (fx.spawn) { s.carry.spawn += fx.spawn; out.push((fx.spawn > 0 ? '+' : '') + fx.spawn + ' to Spawn Rolls next round'); }
  if (fx.spawnX) { s.carry.spawn += x; out.push('+' + x + ' to Spawn Rolls next round'); }
  if (fx.first) { s.carry.first += fx.first; out.push('+' + fx.first + ' to the first Spawn Roll next round'); }
  if (fx.force) { s.carry.force.push(fx.force); out.push(MIS[fx.force].name + ' joins next round'); }
  if (fx.forceNow) { forceMisery(s, fx.forceNow); out.push(MIS[fx.forceNow].name + ' resolves now'); }
  if (fx.removeShop) { s.removedShop.push(fx.removeShop); out.push(SHOP[fx.removeShop].name + ' removed from the shop'); }
  if (fx.clearFortified) { clearFortified(s); out.push('all fortified markers removed'); }
  if (fx.lz) { s.carry.lz = true; out.push('first purchase 3 SP cheaper next Resupply'); }
  if (fx.save) { const idx = ownerFor(fx.save); s.saved.push({ id: cardId, owner: idx }); out.push(s.players[idx].name + ' saves the card'); }
  if (fx.grants && !nobody) fx.grants.forEach(g => { const idx = ownerFor(g.to); s.saved.push({ id: cardId, owner: idx, perk: { item: g.item } }); out.push(s.players[idx].name + ' gets a free ' + SHOP[g.item].name); });
  if (fx.plans) { const changed = changeOfPlansForAll(s, fx.plans === 'random'); out.push(changed + ' player' + (changed === 1 ? '' : 's') + (fx.plans === 'random' ? ' got a random new Secret Objective' : ' choose a new Secret Objective on the Players tab')); }
  if (fx.custom === 'use-it-or-lose-it') {
    const roll = rollD6(); const idx = randInt(s.players.length); const amount = roll >= 4 ? x : 3;
    gainSP(s, idx, amount); out.push('D6 ' + roll + ': ' + amount + ' SP to ' + s.players[idx].name);

}
function resolveSecondary(s, id, success, x, who) {
  const card = SEC[id];
  const deck = s.decks.secondary;
  deck.active = deck.active.filter(c => c !== id);
  const fx = success ? card.rewFx : card.penFx;
  const out = fx ? applyFx(s, fx, card.xMax ? Math.min(x, card.xMax) : x, id, who) : [];
  if (!(success && fx && fx.save)) deck.discard.push(id);
  s.secStats[success ? 'won' : 'lost'] += 1;
  delete s.secX[id];
  addLog(s, card.name + (success ? ' succeeded' : ' failed') + (out.length ? ': ' + out.join(', ') : ''));
}
/* Does a successful reward need to know which player triggered it? (Tactical Withdrawal, Dragon Slayer, ...) */
const rewardNeedsPlayer = card => !!card.rewFx && (card.rewFx.save === 'pick' || (card.rewFx.grants || []).some(g => g.to === 'pick'));
/* Why Success is not allowed yet for an X card, or ''. */
function xProblem(card, x) {
  if (card.xMin != null && x < card.xMin) return card.name + ': X must be at least ' + card.xMin + ' for Success';
  return '';
}
/* What the app can count for a mission, so X is filled in for you (you can still change it). */
function autoX(s, id) {
  const since = s.secAt[id] || 0;
  if (id === 's02') return s.destroyed.filter(d => d.dRound === s.round && d.seq > since && d.by !== 'zone').length;
  if (id === 's11') return s.buys.filter(b => b.seq > since).reduce((total, b) => total + b.sp, 0);

}
const missionX = (s, id) => s.secX[id] != null ? Number(s.secX[id]) || 0 : (autoX(s, id) || 0);
/* A short line with what the app knows about a mission's condition. */
function missionHint(s, id) {
  const tagBuys = tag => s.buys.filter(b => b.tags.includes(tag)).length;
  if (id === 's02') return 'App count: ' + autoX(s, id) + ' Horde units destroyed by players since this was revealed.';
  if (id === 's11') return 'App count: ' + autoX(s, id) + ' SP spent in the shop since this was revealed.';
  if (id === 's13') return 'App count: ' + tagBuys('Strike') + ' Strike purchases this round.';
  if (id === 's14') return 'App count: ' + tagBuys('Supply') + ' Supply purchases this round.';
  if (id === 's07') { const n = s.horde.reduce((total, h) => total + entryCharacters(parseEntry(h.raw)).length, 0); return 'Horde CHARACTER models on the table: ' + n + '.'; }
  if (id === 's08') { const n = s.horde.filter(h => entryHasVehicleOrMonster(parseEntry(h.raw))).length; return 'Horde VEHICLE or MONSTER units on the table: ' + n + '.'; }
  if (id === 's17') return 'Fortified objectives (app markers): ' + Object.keys(STANDING).filter(k => s.standing[k]).length + '.';

/* ---- Resupply shop ---- */
function shopPrice(s, item, playerIndex, x) {
  let price = item.price === 'X' ? x : item.price;
  if (activeMisery('m24', s)) price *= 2;
  if (s.rnd.lz && !s.players[playerIndex].lzUsed) price = Math.max(0, price - 3);
  return price;
}
const boughtKey = (s, item, pi) => s.round + ':' + item.id + (item.once === 'turnPlayer' ? ':' + pi : '');
/* Returns a reason the purchase is not possible, or '' when it is.
   opts.free: a saved reward pays for it; opts.discount: SP taken off the price. */
function shopCheck(s, item, pi, x, opts = {}) {
  const p = s.players[pi];
  if (!p) return 'Pick a player';
  if (s.removedShop.includes(item.id)) return item.name + ' was removed from the shop';
  const has = tag => item.tags.includes(tag);
  if (activeMisery('m21', s) && has('Fortify')) return 'Bunkers Busted: no Fortify purchases';
  if (activeMisery('m22', s) && (has('Supply') || has('Spawn') || has('Strike'))) return 'Comms Jammed: no Supply, Spawn or Strike purchases';
  if (activeMisery('m23', s) && has('Tactics')) return 'The Mind Killer: no Tactics purchases';
  if (activeMisery('m29', s) && has('Secondary')) return "Fate's Fetters: no Secondary purchases";
  if (item.price === 'X' && !(Number.isInteger(x) && x >= 1)) return 'Enter X (1 or more)';
  const price = opts.free ? 0 : Math.max(0, shopPrice(s, item, pi, x) - (opts.discount || 0));
  if (p.sp < price) return p.name + ' needs ' + price + ' SP (has ' + p.sp + ')';
  if (item.once && s.bought[boughtKey(s, item, pi)]) return item.name + ' was already bought this round';
  if (item.stand && s.standing[item.stand]) return STANDING[item.stand].name + ' already exists (only one at a time)';
  if (item.id === 'mine' && s.standing.mine) return 'A Minefield already exists';
  if (item.auto === 'plans') {
    if (s.setup.rounds === 'inf') return 'No Secret Objectives in an infinite game';
    if (!p.secret.kept) return p.name + ' has no kept Secret Objective to replace';
    if (p.secret.revealed) return p.name + "'s Secret Objective is already revealed";
  }
  if (item.auto === 'second-mission' && s.decks.secondary.active.length >= 2) return 'Two Secondary Missions are already active';
  if (item.auto === 'share' && s.players.length < 2) return 'No other player to give SP to';
  if (item.auto === 'replace-secondary' && !s.decks.secondary.active.length) return 'No active Secondary Mission to replace';
  return '';
}
function payFor(s, item, pi, x, discount = 0) {
  const p = s.players[pi];
  const price = Math.max(0, shopPrice(s, item, pi, x) - discount);
  p.sp -= price;
  if (s.rnd.lz && !p.lzUsed) p.lzUsed = true;
  if (item.once) s.bought[boughtKey(s, item, pi)] = true;
  s.buys.push({ seq: s.uid++, pi, item: item.id, sp: price, tags: item.tags });
  addLog(s, p.name + ' bought ' + item.name + (item.price === 'X' ? ' (X=' + x + ')' : '') + ' for ' + price + ' SP');
}
/* A purchase paid for by a saved reward card: no SP, but limits and Misery restrictions still apply. */
function takeFree(s, item, pi, x, cardName, to) {
  if (item.once) s.bought[boughtKey(s, item, pi)] = true;
  if (item.auto === 'share') gainSP(s, to, 2);
  s.buys.push({ seq: s.uid++, pi, item: item.id, sp: 0, tags: item.tags });
  addLog(s, s.players[pi].name + ' took ' + item.name + ' free (' + cardName + ')');
  completePurchase(s, item, pi);
}

  if (item.auto === 'second-mission') revealSecondary(s);
  if (item.auto === 'plans') startChangeOfPlans(s, pi);
  if (item.auto === 'replace-secondary' && s.decks.secondary.active.length === 1) redrawSecondary(s, s.decks.secondary.active[0]);
  if (item.stand) s.standing[item.stand] = true;
  if (item.count) { const [key, max] = item.count; s.standing[key] = Math.min(max, (s.standing[key] || 0) + 1); }
}

/* ---- Saved reward cards (Secondary Mission rewards a player keeps for later) ---- */
const perkOf = sv => sv.perk || SEC[sv.id].perk || null;
function perkLabel(perk) {
  if (!perk) return '';
  if (perk.cancelMisery) return 'Cancel one revealed Misery card';
  if (perk.tag) return 'One free ' + perk.tag + ' purchase';
  if (perk.discount) return SHOP[perk.item].name + ' costs ' + perk.discount + ' SP less';
  return perk.uses > 1 ? 'Up to ' + perk.uses + ' free ' + SHOP[perk.item].name : 'One free ' + SHOP[perk.item].name;
}
/* The card leaves the player: a saved card goes to the Secondary discard pile, a handed-out freebie just ends. */
function spendSaved(s, idx) {

  if (sv && !sv.perk) s.decks.secondary.discard.push(sv.id);

}
function useSavedFree(s, idx, itemId, x, to) {

  takeFree(s, SHOP[itemId], sv.owner, x, SEC[sv.id].name, to);
  sv.left = (sv.left == null ? (perkOf(sv).uses || 1) : sv.left) - 1;

}
function useSavedDiscount(s, idx) {

  const perk = perkOf(sv);

  deck.active = deck.active.filter(id => id !== miseryId);
  deck.discard.push(miseryId);
  addLog(s, s.players[sv.owner].name + ' used ' + SEC[sv.id].name + ' to cancel ' + MIS[miseryId].name);

/* ---- Secret Objectives ---- */
function dealSecrets(s) {
  s.players.forEach(p => {
    const take = Math.min(2, s.decks.secret.draw.length);
    p.secret = { choices: take ? s.decks.secret.draw.splice(-take) : [], kept: null, revealed: false };
  });
  s.secretDealt = true;
  addLog(s, 'Secret Objectives dealt');
}
function keepSecret(s, pi, id) {
  const p = s.players[pi];
  const rest = p.secret.choices.filter(c => c !== id);
  s.decks.secret.draw = shuffle([...s.decks.secret.draw, ...rest]);
  p.secret = { choices: [], kept: id, revealed: false };
}
function startChangeOfPlans(s, pi) {
  const p = s.players[pi];
  const take = Math.min(2, s.decks.secret.draw.length);
  const fresh = take ? s.decks.secret.draw.splice(-take) : [];

/* Establish Orbital Comms: every player with a kept, unrevealed objective uses A Change of Plans for free.

function changeOfPlansForAll(s, atRandom) {
  if (s.setup.rounds === 'inf') return 0;
  let changed = 0;
  s.players.forEach((p, pi) => {
    if (!p.secret.kept || p.secret.revealed) return;
    startChangeOfPlans(s, pi);
    if (atRandom) keepSecret(s, pi, p.secret.choices[randInt(p.secret.choices.length)]);
    changed += 1;

/* ---- Zones and roster ---- */
const zoneOf = (s, zoneId) => s.zones.find(z => z.id === zoneId);
function setDie(s, zoneId, index, value) {
  const z = zoneOf(s, zoneId);
  const needed = diceNeeded(s);
  if (!z.dice || z.dice.length !== needed) z.dice = Array(needed).fill(0);
  z.dice[index] = value;
  if (z.dice.every(d => d) && !s.zones.some(o => o.usedFirst)) z.usedFirst = true;
  rebuildSlots(z, s);
}
function rollZone(s, zoneId) {
  const z = zoneOf(s, zoneId);
  z.dice = Array.from({ length: diceNeeded(s) }, rollD6);
  if (!s.zones.some(o => o.usedFirst)) z.usedFirst = true;
  rebuildSlots(z, s);
}
function pickUnit(s, zoneId, slotId, raw) {
  const z = zoneOf(s, zoneId);
  const slot = z.slots.find(sl => sl.id === slotId);
  if (!slot || slot.filled) return;
  slot.filled = raw;
  const e = parseEntry(raw);
  const zoneNo = z.extra ? 0 : s.zones.filter(o => !o.extra).indexOf(z) + 1;
  s.horde.push({ uid: s.uid++, zone: zoneId, zoneNo, round: effRound(s), raw, baseKey: e.baseKey, need: e.need, bracket: slot.bracket });
  addLog(s, 'Spawned ' + e.label + ' ' + bracketLabel(slot.bracket));
}
function rollDownSlot(s, zoneId, slotId) {
  const z = zoneOf(s, zoneId);
  const i = z.slots.findIndex(sl => sl.id === slotId);
  if (i < 0) return;
  const slot = z.slots[i];
  const lower = BRACKET_KEYS.indexOf(slot.bracket) - 1;
  if (slot.filled || lower < 0) return;
  z.slots.splice(i, 1,
    { id: z.ns++, bracket: BRACKET_KEYS[lower], filled: null, draft: null, rejected: [] },
    { id: z.ns++, bracket: BRACKET_KEYS[lower], filled: null, draft: null, rejected: [] });
}
/* by: a player index, 'zone' (cleared from a Spawn Zone) or 'none'. Destroyed units are kept for the Warlord and mission counts. */
function destroyUnit(s, uid, playerIndex, by) {
  const i = s.horde.findIndex(h => h.uid === uid);
  if (i < 0) return;
  const unit = s.horde[i];
  s.horde.splice(i, 1);
  s.destroyed.push(Object.assign({}, unit, { dRound: s.round, by: playerIndex >= 0 ? playerIndex : (by || 'none'), seq: s.uid++ }));
  const label = parseEntry(unit.raw).label;
  addLog(s, by === 'zone' ? label + ' cleared from a Spawn Zone (no SP)' : 'Destroyed ' + label + (playerIndex >= 0 ? ' (+1 SP ' + s.players[playerIndex].name + ')' : ''));
  if (playerIndex >= 0) gainSP(s, playerIndex, 1);

/* Rules 4 step 2, Clear Spawn Zone. value: '' (nothing cleared), 'u:<uid>' (that Horde unit is destroyed, no SP)

  if (z.cleared) restoreCleared(s, z);
  z.removed = null;

    const unit = s.horde.find(h => h.uid === Number(value.slice(2)));

}
function restoreCleared(s, z) {
  const unit = z.cleared;
  s.destroyed = s.destroyed.filter(d => !(d.uid === unit.uid && d.by === 'zone'));
  if (!s.horde.some(h => h.uid === unit.uid)) { s.horde.push(unit); s.horde.sort((a, b) => a.uid - b.uid); }
  z.cleared = null;
}
/* Rules 4: "The first Character model spawned by the Horde acts as the Warlord." Destroyed units count, so the Warlord
   never moves to another unit. Returns { uid, name, alive } or null. */
function hordeWarlord(s = state) {
  const everyUnit = [...s.horde, ...s.destroyed].sort((a, b) => a.uid - b.uid);
  for (const h of everyUnit) {
    const character = entryCharacters(parseEntry(h.raw)).find(c => c.warlordOk);
    if (character) return { uid: h.uid, name: character.name, alive: s.horde.some(x => x.uid === h.uid) };
  }
  return null;
}

/* Redo the current round's spawn: every zone starts over and the units spawned this round are removed.
   Units from earlier rounds stay (a unit cleared from a zone comes back), and extra zones (Pincer Maneuver) are kept as fresh zones. */
function resetSpawn(s) {
  const round = effRound(s);
  s.zones.filter(z => z.cleared).forEach(z => restoreCleared(s, z));
  s.horde = s.horde.filter(h => h.round !== round);
  const extras = s.zones.filter(z => z.extra).length;
  makeZones(s);
  for (let i = 0; i < extras; i++) s.zones.push(newZone(s, true));
  addLog(s, 'Round ' + round + ' spawn reset');
}
const hasSpawnToReset = (s = state) => s.horde.some(h => h.round === effRound(s)) || s.zones.some(z => z.dice || z.removed || z.slots.length);

/* Random pick for a slot, as a draft the player can accept or roll again. Uniform among the possible options that were
   not already turned down for this slot; once every option was turned down the list starts over (never the same twice in a row). */
function drawRandom(s, zoneId, slotId) {
  const z = zoneOf(s, zoneId);
  const slot = z.slots.find(sl => sl.id === slotId);
  if (!slot || slot.filled) return;
  const possible = rankOptions(slot.bracket, z.seed + ':' + slot.id, s).filter(o => o.available).map(o => o.raw);
  const turnedDown = slot.draft;
  slot.rejected = slot.rejected || [];
  if (turnedDown) slot.rejected.push(turnedDown); else slot.rejected = [];
  let pool = possible.filter(raw => !slot.rejected.includes(raw));
  if (!pool.length) { slot.rejected = turnedDown ? [turnedDown] : []; pool = possible.filter(raw => !slot.rejected.includes(raw)); }
  if (!pool.length) pool = possible;
  slot.draft = pool.length ? pool[randInt(pool.length)] : null;
}
function acceptDraft(s, zoneId, slotId) {
  const slot = zoneOf(s, zoneId).slots.find(sl => sl.id === slotId);
  if (!slot || !slot.draft) return;
  const raw = slot.draft;
  pickUnit(s, zoneId, slotId, raw);
  slot.draft = null; slot.rejected = [];
}
function cancelDraft(s, zoneId, slotId) {
  const slot = zoneOf(s, zoneId).slots.find(sl => sl.id === slotId);
  if (slot) { slot.draft = null; slot.rejected = []; }
}
/* Take a spawned unit back off the table and draw another random one for the same slot. */
function replaceUnit(s, zoneId, slotId) {
  const slot = zoneOf(s, zoneId).slots.find(sl => sl.id === slotId);
  if (!slot || !slot.filled) return;
  const i = s.horde.findIndex(h => h.zone === zoneId && h.raw === slot.filled);
  if (i < 0) return;
  const removed = slot.filled;
  s.horde.splice(i, 1);
  slot.filled = null; slot.rejected = []; slot.draft = removed;
  drawRandom(s, zoneId, slotId);
  addLog(s, 'Replaced ' + parseEntry(removed).label + ' ' + bracketLabel(slot.bracket));
}

/* ---- Turn sequence ---- */
function beginRound(s, round) {
  s.round = round; s.stage = 'start';
  s.rnd = s.carry; s.carry = zeroCarry();
  s.ticks = {}; s.manualMod = 0; s.objectives = 0; s.buys = [];
  s.players.forEach(p => { p.spRound = 0; p.lzUsed = false; });
  if (round > 1) makeZones(s);
  addLog(s, 'Round ' + round + ' begins');
}
function startGame(s) {
  s.rnd = zeroCarry(); s.carry = zeroCarry();
  s.round = 1; s.stage = 'start'; s.ticks = {};
  s.players.forEach(p => { p.spRound = 0; p.lzUsed = false; });
  addLog(s, 'Game started');
}
/* The deployment spawn counts as round 1's spawn, so starting round 1 before every zone is done is easy to do by mistake. */
function setupSpawnUnfinished(s = state) {
  return s.stage === 'setup' && s.zones.some(z => ['pending', 'filling'].includes(zoneStatus(z, s).status));
}
function advance(s) {
  if (s.stage === 'setup') { startGame(s); return; }
  if (s.stage === 'over') return;
  const list = stagesFor(s.round, s);
  const i = list.indexOf(s.stage);
  if (i < list.length - 1) { s.stage = list[i + 1]; return; }
  if (s.round >= totalRounds(s)) { s.stage = 'over'; addLog(s, 'Game over'); return; }
  beginRound(s, s.round + 1);
}
function retreat(s) {
  if (s.stage === 'over') { s.stage = 'end'; return; }
  if (s.stage === 'setup') return;
  const list = stagesFor(s.round, s);
  const i = list.indexOf(s.stage);
  if (i > 0) { s.stage = list[i - 1]; return; }
  if (s.round === 1) { s.round = 0; s.stage = 'setup'; }
}
/* The three automatic start-of-round steps. Each runs once per round (the 'auto:' ticks), so a second tap cannot
   reveal extra cards; undo if a step must be redone. */
function stepDiscardMisery(s) {
  if (s.ticks['auto:discard']) return;
  discardActiveMisery(s);
  s.ticks['auto:discard'] = s.ticks['start:0'] = true;
}
function stepRevealMisery(s) {
  if (s.ticks['auto:misery']) return;
  stepDiscardMisery(s);
  s.rnd.force.forEach(id => forceMisery(s, id));
  s.rnd.force = [];
  revealMisery(s, miseryCountThisRound(s));
  s.ticks['auto:misery'] = s.ticks['start:1'] = true;
}
function stepRevealSecondary(s) {
  if (s.ticks['auto:secondary']) return;
  revealSecondary(s);
  s.ticks['auto:secondary'] = s.ticks['start:2'] = true;
}
function runRoundStart(s) {
  stepDiscardMisery(s);
  stepRevealMisery(s);
  stepRevealSecondary(s);
}
const roundStartDone = (s = state) => !!(s.ticks['auto:discard'] && s.ticks['auto:misery'] && s.ticks['auto:secondary']);

/* ============================== RENDERING ============================== */
const TABS = [['turn', 'Turn', '▶'], ['horde', 'Horde', '☠'], ['cards', 'Cards', '▤'], ['players', 'Players', '☻'], ['setup', 'Setup', '⚙']];
const SHOP_TAGS = ['All', 'Tactics', 'Supply', 'Strike', 'Fortify', 'Secondary', 'Spawn'];
const stageText = stage => ({ horde: '☠ ', players: '⚔ ', round: '' }[STAGES[stage].who]) + STAGES[stage].label;
const chip = (text, kind = '') => `<span class="chip ${kind}">${esc(text)}</span>`;
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

function nextLabel(s) {
  if (s.stage === 'setup') return 'Start round 1';
  if (s.stage === 'over') return 'Game over';
  const list = stagesFor(s.round, s);
  const i = list.indexOf(s.stage);
  if (i < list.length - 1) return 'Next: ' + stageText(list[i + 1]);
  return s.round >= totalRounds(s) ? 'Finish game' : 'Start round ' + (s.round + 1);
}
function renderTracker() {
  const s = state;
  const st = STAGES[s.stage];
  const who = st.who === 'horde' ? '☠ Horde turn' : st.who === 'players' ? '⚔ Players turn' : s.stage === 'setup' ? 'Setup' : s.stage === 'over' ? 'Game over' : 'Battle round';
  const total = totalRounds(s);
  const roundText = s.round ? `Round <b>${s.round}</b>${total === Infinity ? ' (no limit)' : ' / ' + total}` : 'Before round 1';
  const list = (s.stage === 'setup' || s.stage === 'over') ? [] : stagesFor(s.round, s);
  const here = list.indexOf(s.stage);
  const pills = list.map((id, i) => `<button class="pill ${STAGES[id].who} ${i < here ? 'done' : ''}" data-act="goto" data-stage="${id}" ${id === s.stage ? 'aria-current="step"' : ''}>${esc(stageText(id))}</button>`).join('');
  const chips = s.players.map(p => `<button class="pchip" data-act="tab" data-tab="players">${esc(p.name)} <span class="cp">CP ${p.cp}</span> <span class="sp">SP ${p.sp}</span></button>`).join('');
  const canBack = !(s.stage === 'setup' || (s.stage === 'start' && s.round > 1));
  return `<div class="tracker">
    <div class="tr-top"><div class="who">${who}</div><div class="round">${roundText}${s.setup.hard ? '<span class="mode-tag">Hard</span>' : ''}</div></div>

      <button class="navbtn" data-act="undo" aria-label="Undo last change">↶</button></div>
    ${pills ? `<div class="pills">${pills}</div>` : ''}
  </div>`;
}
function renderTabbar() {
  return TABS.map(([id, label, icon]) => `<button class="tab" role="tab" data-act="tab" data-tab="${id}" aria-selected="${state.tab === id}"><span class="ic" aria-hidden="true">${icon}</span>${label}</button>`).join('');
}

/* ---------- Pieces shared by several tabs ---------- */
function renderItems(stage, items) {

    const k = stage + ':' + i;

    return `<li class="item ${on ? 'done' : ''}"><button class="tick" data-act="tick" data-k="${k}" aria-pressed="${on}" aria-label="Mark done">${on ? '✓' : ''}</button><div class="txt">${md(text)}</div></li>`;

}
function miseryCard(id, big) {

  return `<article class="gcard misery ${big ? 'big' : ''}"><div class="hd"><span class="no">${c.n}</span><span class="nm">${esc(c.name)}</span></div><p>${esc(c.text)}</p></article>`;
}
function secondaryCard(id, big) {
  const c = SEC[id];
  return `<article class="gcard secondary ${big ? 'big' : ''}"><div class="hd"><span class="no">${c.n}</span><span class="nm">${esc(c.name)}</span>${c.verify ? chip('Check wording', 'warn') : ''}</div>
    <div class="lbl">Condition</div><p>${esc(c.cond)}</p><div class="lbl">Reward</div><p>${esc(c.rew)}</p><div class="lbl">Punishment</div><p>${esc(c.pen)}</p></article>`;
}

  return `<article class="gcard secret"><div class="hd"><span class="no">${c.n}</span><span class="nm">${esc(c.name)}</span></div><p>${esc(c.text)}</p><div class="ft">${c.tags.map(t => chip(t)).join('')}</div></article>`;

function faceDown(label) { return `<article class="gcard secret back"><b>${esc(label)}</b><span class="small">hidden</span></article>`; }

function renderInPlay() {
  const s = state;
  if (s.stage === 'setup' || s.stage === 'over') return '';
  const mis = s.decks.misery.active, sec = s.stage === 'end' ? [] : s.decks.secondary.active;
  const standing = [];
  Object.keys(STANDING).forEach(k => { if (s.standing[k] && STANDING[k].when.includes(s.stage)) standing.push(STANDING[k]); });
  Object.keys(STANDING_COUNTED).forEach(k => { if (s.standing[k] && STANDING_COUNTED[k].when.includes(s.stage)) standing.push({ name: STANDING_COUNTED[k].name + ' ×' + s.standing[k], text: STANDING_COUNTED[k].text }); });
  if (!mis.length && !sec.length && !standing.length) return `<section class="panel"><h3>In play</h3><p class="sub">No active Misery cards, Secondary Missions or standing effects.</p></section>`;
  return `<section class="panel"><h3>In play now</h3>
    ${mis.length ? `<div class="cards">${mis.map(id => miseryCard(id)).join('')}</div>` : ''}
    ${sec.length ? `<div class="cards">${sec.map(id => `<div>${secondaryCard(id)}<div class="row" style="margin-top:6px"><button class="btn sm" data-act="sec-drop" data-id="${id}">Discard Secondary</button><button class="btn sm" data-act="sec-redraw" data-id="${id}">Discard and reveal new</button></div></div>`).join('')}</div>` : ''}
    ${standing.map(e => `<div class="note good"><b>${esc(e.name)}:</b> ${esc(e.text)}</div>`).join('')}
  </section>`;
}

/* ---------- Resupply shop ---------- */
function renderShop() {
  const s = state;
  const pi = Math.min(s.buyer, s.players.length - 1);
  const buyer = s.players[pi];
  const tag = ui.shopTag || 'All';
  const blocked = [];
  if (activeMisery('m21')) blocked.push('Fortify');
  if (activeMisery('m22')) blocked.push('Supply, Spawn, Strike');
  if (activeMisery('m23')) blocked.push('Tactics');
  if (activeMisery('m29')) blocked.push('Secondary');
  const items = RESUPPLY.filter(it => tag === 'All' || it.tags.includes(tag));
  /* One compact row per item: tap the name for the full text. A missing-SP reason is shown by the disabled price button
     alone; other reasons (Misery, once per turn, limits) get a line. */
  const rows = items.map(it => {
    const x = it.price === 'X' ? (Number(s.secX['shop:' + it.id]) || 1) : 0;
    const reason = shopCheck(s, it, pi, x);
    const price = shopPrice(s, it, pi, x);
    const open = !!ui.exp['shop:' + it.id];
    const shortOfSp = reason && buyer.sp < price && it.price !== 'X';
    return `<article class="shoprow ${reason ? 'blocked' : ''}"><div class="shophead">
        <div class="grow"><button class="linkbtn" data-act="exp" data-k="shop:${it.id}" aria-expanded="${open}">${esc(it.name)}</button>
          <div class="ft">${it.tags.map(t => chip(t)).join('')}${it.once ? chip('Once per turn', 'warn') : ''}</div></div>
        <div class="row nowrap">${it.price === 'X' ? `<label class="small">X <input type="number" min="1" step="1" value="${x}" data-change="shopx" data-id="${it.id}" aria-label="X for ${esc(it.name)}"></label>` : ''}
          <button class="btn primary sm" data-act="buy" data-id="${it.id}" ${reason ? 'disabled' : ''} aria-label="Buy ${esc(it.name)} for ${price} SP">${price} SP</button></div></div>
      ${open ? `<p class="small">${esc(it.text)}</p>` : ''}
      ${reason && !shortOfSp ? `<p class="small" style="color:var(--bad)">${esc(reason)}</p>` : ''}</article>`;
  }).join('');
  return `<section class="panel"><h2>Resupply table</h2>
    <div class="row"><span class="small muted">Buying for</span><div class="seg" role="group">${s.players.map((p, i) => `<button data-act="buyer" data-i="${i}" aria-pressed="${i === pi}">${esc(p.name)}</button>`).join('')}</div>${chip(buyer.sp + ' SP', 'sp')}</div>
    ${s.stage !== 'p-command' ? `<p class="note">Normally SP is spent in the Resupply step of the Players' Command phase.</p>` : ''}
    ${blocked.length ? `<p class="note bad">Blocked by Misery cards: ${esc(blocked.join('; '))}.${activeMisery('m24') ? ' Prices are doubled.' : ''}</p>` : (activeMisery('m24') ? `<p class="note bad">Seller's Market: prices are doubled.</p>` : '')}
    ${s.rnd.lz ? `<p class="note good">Secure the LZ: each player's first purchase is 3 SP cheaper${buyer.lzUsed ? ' (used by ' + esc(buyer.name) + ')' : ''}.</p>` : ''}
    <div class="seg" role="group" aria-label="Filter by tag">${SHOP_TAGS.map(t => `<button data-act="shoptag" data-tag="${t}" aria-pressed="${t === tag}">${t}</button>`).join('')}</div>
    <p class="small muted">Tap an item's name for what it does. The button shows the price to pay now.</p>
    <div class="shoplist">${rows}</div></section>`;
}

/* ---------- Turn tab ---------- */
/* How many players were dealt Secret Objectives but have not kept one yet. */
const secretsPending = (s = state) => s.players.filter(p => p.secret.choices.length).length;
const pendingSecretsText = n => n + ' player' + (n === 1 ? ' still has' : 's still have') + ' to keep a Secret Objective';
function renderStageExtras() {
  const s = state;

      <button class="btn" data-act="tab" data-tab="horde">Spawn first Horde ▶</button></div>`;

    return `${secretsPending() ? `<p class="note bad">${pendingSecretsText(secretsPending())} (Players tab).</p>` : ''}<div class="note good"><b>Round ${r}:</b> reveal <b>${n}</b> Misery card${n === 1 ? '' : 's'} (${rr.misery} base${s.rnd.misery ? ' + ' + s.rnd.misery + ' carried' : ''})${forced.length ? ', plus forced: ' + esc(forced.join(', ')) : ''}. ${esc(spawnLine)}${isHordeOnlyRound(r) ? ' Only the Horde plays this round.' : ''}</div>
      <div class="row"><button class="btn primary" data-act="roundstart" ${roundStartDone() ? 'disabled' : ''}>${roundStartDone() ? '✓ Steps 1 to 3 done' : 'Run steps 1 to 3'}</button>
      <button class="btn sm" data-act="r-discard" ${s.ticks['auto:discard'] ? 'disabled' : ''}>1 Discard Misery</button><button class="btn sm" data-act="r-misery" ${s.ticks['auto:misery'] ? 'disabled' : ''}>2 Reveal Misery</button><button class="btn sm" data-act="r-secondary" ${s.ticks['auto:secondary'] ? 'disabled' : ''}>3 Reveal Secondary</button>
      ${r > 1 ? `<button class="btn sm" data-act="tab" data-tab="horde">5 Spawn the Horde ▶</button>` : ''}</div>`;
  }
  if (stage === 'p-command') {
    const fob = s.standing.fob ? 1 : 0;
    const each = s.objectives + fob;
    return `<div class="row spread"><div><b>Objectives controlled by any player</b><div class="sub">${fob ? 'Forward Operating Base adds +1. ' : ''}${s.players.length === 1 ? 'Single player: doubled.' : 'Each player gains this much.'}</div></div>
      <div class="stepper"><button data-act="obj" data-d="-1" aria-label="Fewer objectives">−</button><span class="num">${s.objectives}</span><button data-act="obj" data-d="1" aria-label="More objectives">+</button></div></div>
      <button class="btn primary" data-act="income" ${s.ticks['p-command:2'] ? 'disabled' : ''}>${s.ticks['p-command:2'] ? 'SP income given' : 'Give ' + each + ' SP to each player'}</button>`;
  }
  if (stage === 'end') {
    const active = s.decks.secondary.active;
    const resolvers = active.map(id => {
      const c = SEC[id];
      const x = missionX(s, id);
      const hint = missionHint(s, id);
      return `<div class="panel" style="padding:8px">${secondaryCard(id)}${hint ? `<p class="small muted">${esc(hint)}</p>` : ''}
        <div class="row">${c.x ? `<label class="small">X (${esc(c.x)}) <input type="number" min="0" ${c.xMax ? `max="${c.xMax}"` : ''} step="1" value="${x}" data-change="secx" data-id="${id}"></label>` : ''}
        <button class="btn primary" data-act="sec-ok" data-id="${id}">Success</button><button class="btn danger" data-act="sec-fail" data-id="${id}">Failed</button>
        <button class="btn sm" data-act="sec-drop" data-id="${id}">Discard unresolved</button></div></div>`;
    }).join('');
    const c = s.carry;
    const carry = [c.misery ? '+' + c.misery + ' Misery' : '', c.spawn ? signed(c.spawn) + ' Spawn Rolls' : '', c.first ? signed(c.first) + ' first Spawn Roll' : '', ...c.force.map(id => MIS[id].name), c.lz ? 'cheaper first purchase' : ''].filter(Boolean);
    return `${resolvers || '<p class="sub">No active Secondary Missions to resolve.</p>'}
      <div class="note ${carry.length ? 'bad' : 'good'}"><b>Carried into the next round:</b> ${carry.length ? esc(carry.join(', ')) : 'nothing'}</div>`;
  }
  if (stage === 'over') {
    return `<p>The battle is over. Players who revealed <b>and</b> completed their Secret Objective win individually. Reveal End of Game objectives on the Players tab.</p>
      <div class="row">${s.players.map(p => chip(p.name + ': ' + (p.secret.kept ? (p.secret.revealed ? 'revealed' : 'hidden') : 'no objective'), p.secret.revealed ? 'good' : '')).join('')}</div>
      <button class="btn danger" data-act="sheet" data-type="newgame">New game</button>`;
  }
  return '';
}
function renderTurn() {

/* Fortified markers and counted markers, with remove buttons. */
function renderStanding() {
  const s = state;
  if (s.stage === 'setup' || s.stage === 'over') return '';
  const flags = Object.keys(STANDING).filter(k => s.standing[k]);
  const counted = Object.keys(STANDING_COUNTED).filter(k => s.standing[k]);
  if (!flags.length && !counted.length) return '';

    ${wl && !wl.alive ? `<p class="small muted">The Horde Warlord (${esc(wl.name)}) was destroyed.</p>` : ''}
    <p class="sub">Tap Destroyed when a unit dies: the player who killed it gains 1 SP. Its models then count as free again in your collection. Tap a name for its datasheet and Horde rules.</p></section>`;
  return header + zones + roster;
}

/* ---------- Cards tab ---------- */
function renderCards() {
  const s = state;
  const m = s.decks.misery, sc = s.decks.secondary;
  const counts = d => chip('Deck ' + d.draw.length) + chip('Active ' + d.active.length, d.active.length ? 'good' : '') + chip('Discard ' + d.discard.length);
  const misery = `<section class="panel"><h2>Misery deck</h2>
    <div class="row">${counts(m)}</div>
    <div class="row"><button class="btn primary" data-act="m-draw">Reveal 1</button><button class="btn" data-act="m-discard" ${m.active.length ? '' : 'disabled'}>Discard active</button></div>
    ${m.active.length ? `<div class="cards">${m.active.map(id => miseryCard(id, true)).join('')}</div>` : '<p class="sub">No active Misery cards.</p>'}
    <p class="sub">Revealed in the round-start step (Turn tab). Use Reveal 1 for extra cards from other effects. An empty deck reshuffles the discard.</p></section>`;
  const secondary = `<section class="panel"><h2>Secondary Missions</h2>
    <div class="row">${counts(sc)}</div>
    <div class="row"><button class="btn primary" data-act="s-draw">Reveal 1</button></div>
    ${sc.active.length ? `<div class="cards">${sc.active.map(id => `<div>${secondaryCard(id, true)}<div class="row" style="margin-top:6px"><button class="btn sm" data-act="sec-drop" data-id="${id}">Discard</button><button class="btn sm" data-act="sec-redraw" data-id="${id}">Discard and reveal a new one</button></div></div>`).join('')}</div>` : '<p class="sub">No active Secondary Mission.</p>'}
    <p class="sub">Resolved on the Turn tab at the end of the round. No more than two can be active in a round. This game: ${s.secStats.won} succeeded, ${s.secStats.lost} failed.</p></section>`;
  const refMis = ui.exp['ref-m'], refSec = ui.exp['ref-s'];
  const reference = `<section class="panel"><h2>Card reference</h2>
    <p class="sub">Every Misery card and Secondary Mission. Secret Objectives are not listed on purpose.</p>
    <div class="row"><button class="btn sm" data-act="exp" data-k="ref-m">${refMis ? 'Hide' : 'Show'} all Misery cards</button><button class="btn sm" data-act="exp" data-k="ref-s">${refSec ? 'Hide' : 'Show'} all Secondary Missions</button></div>
    ${refMis ? `<div class="cards">${MISERY.map(c => miseryCard(c.id)).join('')}</div>` : ''}
    ${refSec ? `<div class="cards">${SECONDARY.map(c => secondaryCard(c.id)).join('')}</div>` : ''}</section>`;
  return misery + secondary + reference;
}

/* ---------- Players tab ---------- */
function renderSecretArea(p, i) {
  if (state.setup.rounds === 'inf') return '<p class="sub">No Secret Objectives in an infinite game.</p>';
  const sec = p.secret;
  const peeking = ui.peek === i;
  const peekButton = `<button class="btn sm" data-act="peek" data-i="${i}">Peek (only ${esc(p.name)} looks)</button>`;
  if (sec.choices.length) {
    return `<p class="small muted">Pick 1 to keep. The others go back into the deck.</p>
      <div class="cards">${sec.choices.map(id => peeking ? `<div>${secretCard(id)}<button class="btn primary sm" style="margin-top:6px" data-act="keep" data-i="${i}" data-id="${id}">Keep this one</button></div>` : faceDown('Secret Objective')).join('')}</div>
      ${peeking ? `<button class="btn sm" data-act="hide">Hide cards</button>` : peekButton}`;
  }
  if (sec.kept) {
    if (sec.revealed) return `<div class="cards">${secretCard(sec.kept)}</div>${chip('Revealed', 'good')}`;
    return `<div class="cards">${peeking ? secretCard(sec.kept) : faceDown('Your Secret Objective')}</div>
      <div class="row">${peeking ? `<button class="btn sm" data-act="hide">Hide</button>` : peekButton}<button class="btn sm danger" data-act="sheet" data-type="reveal" data-i="${i}">Reveal to everyone</button></div>`;
  }
  return `<p class="sub">Not dealt yet. Deal them in the Setup step on the Turn tab.</p>`;
}
function renderPlayers() {
  const s = state;
  const cap = spCap();
  const cards = s.players.map((p, i) => {
    const saved = s.saved.map((sv, idx) => ({ sv, idx })).filter(o => o.sv.owner === i);
    return `<section class="panel"><div class="row spread"><input type="text" value="${esc(p.name)}" data-change="pname" data-i="${i}" aria-label="Player ${i + 1} name" style="font-weight:600;max-width:11em"><span class="small muted">${pointsEach()} pts</span></div>
      <div class="row spread"><div class="row"><span class="small muted">CP</span><div class="stepper cp"><button data-act="cp" data-i="${i}" data-d="-1" aria-label="Spend CP">−</button><span class="num">${p.cp}</span><button data-act="cp" data-i="${i}" data-d="1" aria-label="Gain CP">+</button></div></div>
      <div class="row"><span class="small muted">SP</span><div class="stepper sp"><button data-act="sp" data-i="${i}" data-d="-1" aria-label="Spend SP">−</button><span class="num">${p.sp}</span><button data-act="sp" data-i="${i}" data-d="1" aria-label="Gain SP">+</button></div></div></div>
      ${cap === Infinity ? '' : `<p class="small muted">Hard Mode cap: ${p.spRound} of ${cap} SP gained this round.</p>`}
      <h3>Secret Objective</h3>${renderSecretArea(p, i)}
      ${saved.length ? `<h3>Saved reward cards</h3>${saved.map(o => { const perk = perkOf(o.sv); return `<div class="note good"><b>${esc(SEC[o.sv.id].name)}:</b> ${esc(perk ? perkLabel(perk) : SEC[o.sv.id].rew)}${o.sv.left != null ? ' (' + o.sv.left + ' left)' : ''} <button class="btn sm" data-act="sheet" data-type="perk" data-idx="${o.idx}">Use</button></div>`; }).join('')}` : ''}</section>`;
  }).join('');
  return cards + renderShop();
}

/* ---------- Setup tab ---------- */
function renderSetup() {
  const s = state;
  const locked = s.stage !== 'setup';
  const seg = (key, options, current) => `<div class="seg" role="group">${options.map(([value, label]) => `<button data-act="set" data-k="${key}" data-v="${value}" aria-pressed="${String(current) === String(value)}" ${locked && ['points', 'players', 'rounds', 'hard'].includes(key) ? 'disabled' : ''}>${label}</button>`).join('')}</div>`;
  const coll = catalog().map(c => `<label class="field">${esc(c.name)}<span class="small">tables use ${tableSizes(c.key).join(' or ')}${usedModels(c.key) ? ', ' + usedModels(c.key) + ' on table' : ''}</span><input type="number" min="0" step="1" value="${s.collection[c.key] == null ? '' : s.collection[c.key]}" placeholder="any" data-change="coll" data-key="${esc(c.key)}"></label>`).join('');

    ${locked ? `<p class="note">Size, players, rounds and Hard Mode are locked once the game starts. Press Back to the setup step, or start a new game.</p>` : ''}
    <label class="field">Game size ${seg('points', [[1000, '1,000 pt Incursion'], [2000, '2,000 pt Strike Force']], s.setup.points)}</label>
    <label class="field">Players ${seg('players', [[1, '1'], [2, '2'], [3, '3'], [4, '4']], s.setup.players)}</label>
    <p class="small muted">${pointsEach()} pts each, ${s.setup.points === 2000 ? '4' : '2'} Spawn Zones, Detachment Points per player: ${s.setup.points === 2000 ? '3 (Strike Force)' : '2 (Incursion)'}. More players makes the game easier.</p>
    <label class="field">Rounds ${seg('rounds', [[5, '5 rounds'], ['inf', 'Infinite']], s.setup.rounds)}</label>
    <label class="field">Hard Mode add-on ${seg('hard', [[0, 'Off'], [1, 'On']], s.setup.hard ? 1 : 0)}</label>
    <p class="small muted">Hard Mode: a Horde-only 6th round, max ${HARD_SP_CAP} SP gained per player per round (${HARD_SP_CAP * 2} solo), and a harsher Misery and Spawn table.</p>
    <label class="field">Horde spawn sheet ${seg('sheet', [['standard', 'Standard'], ['detailed', 'Detailed']], s.setup.sheet)}</label>
    <label class="field">[13+] bracket (can end the game outright) ${seg('allow13', [[0, 'Off'], [1, 'On']], s.setup.allow13 ? 1 : 0)}</label>
    <label class="field">Traitor Secret Objectives ${seg('excludeTraitor', [[0, 'Included'], [1, 'Removed']], s.setup.excludeTraitor ? 1 : 0)}</label>
    <p class="small muted">Removing the Traitor-tagged objectives keeps the game friendlier. It applies the next time objectives are dealt.</p></section>
    <section class="panel"><h2>Players</h2>${s.players.map((p, i) => `<label class="field">Player ${i + 1}<input type="text" value="${esc(p.name)}" data-change="pname" data-i="${i}"></label>`).join('')}</section>
    <section class="panel"><h2>Your ${esc(FACTION.name)} collection</h2>
      <p class="sub">Spawn options are ranked by what you can actually field. Enter how many models you own of each unit (blank means any number); "tables use" shows the unit sizes the spawn tables ask for. Units on the table use up models.</p>
      <button class="btn sm" data-act="exp" data-k="coll">${ui.exp.coll ? 'Hide' : 'Edit'} collection (${Object.keys(s.collection).length} set)</button>
      ${ui.exp.coll ? `<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))">${coll}</div>` : ''}</section>
    <section class="panel"><h2>Look</h2><div class="seg" role="group">${[['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button data-act="theme" data-v="${v}" aria-pressed="${s.theme === v}">${l}</button>`).join('')}</div></section>
    <section class="panel"><h2>Log</h2>${s.log.length ? `<ul class="log">${s.log.slice(0, 40).map(l => `<li><span class="muted">R${l.r}</span> ${esc(l.text)}</li>`).join('')}</ul>` : '<p class="sub">Nothing yet.</p>'}</section>
    <section class="panel"><h2>About</h2>
      <p class="small">Horde Mode 11th Edition v0.9 by The Poorhammer Podcast. Spawn brackets courtesy of DigitalBeef (sheet updated ${esc(SPAWN.updated)}). Unit stats, weapons and keywords from ${esc(UNITS.source)} (${esc(UNITS.version)}). Card and rules text is summarised in our own words: check the source documents for exact wording.</p>
      <button class="btn danger" data-act="sheet" data-type="newgame">New game</button></section>`;
}

/* ---------- Modal sheet ---------- */
function renderSheet() {
  const sh = ui.sheet;
  if (!sh) return '';
  const s = state;
  let inner = '';
  if (sh.type === 'newgame') {
    inner = `<h2>Start a new game?</h2><p>This clears the decks, SP, CP and Horde. Your settings and collection are kept.</p><div class="row"><button class="btn danger" data-act="newgame-do">New game</button><button class="btn" data-act="sheet-close">Cancel</button></div>`;
  } else if (sh.type === 'destroy') {
    const unit = s.horde.find(h => h.uid === sh.uid);
    if (!unit) { ui.sheet = null; return ''; }
    inner = `<h2>${esc(parseEntry(unit.raw).label)} destroyed</h2><p>Which player gets 1 SP for the kill?</p><div class="row">${s.players.map((p, i) => `<button class="btn primary" data-act="destroy-by" data-i="${i}">${esc(p.name)}</button>`).join('')}<button class="btn" data-act="destroy-by" data-i="-1">Nobody</button></div><button class="btn" data-act="sheet-close">Cancel</button>`;
  } else if (sh.type === 'share') {
    inner = `<h2>Share Supplies</h2><p>${esc(s.players[sh.pi].name)} pays 3 SP and gives 2 SP to:</p><div class="row">${s.players.map((p, i) => i === sh.pi ? '' : `<button class="btn primary" data-act="share-do" data-to="${i}">${esc(p.name)}</button>`).join('')}</div><button class="btn" data-act="sheet-close">Cancel</button>`;
  } else if (sh.type === 'startearly') {
    inner = `<h2>Start round 1 without the first spawn?</h2><p>Some Spawn Zones are not rolled or not filled yet. The deployment spawn counts as round 1's spawn.</p><div class="row"><button class="btn danger" data-act="startearly-do">Start anyway</button><button class="btn" data-act="sheet-close">Back</button></div>`;
  } else if (sh.type === 'resetspawn') {
    const count = s.horde.filter(h => h.round === effRound(s)).length;
    inner = `<h2>Redo this round's spawn?</h2><p>This clears every Spawn Zone (dice, cleared-unit choices and picks)${count ? ' and removes the ' + count + ' Horde unit' + (count === 1 ? '' : 's') + ' spawned this round' : ''}. Units from earlier rounds stay. The ↶ button undoes it.</p><div class="row"><button class="btn danger" data-act="resetspawn-do">Redo spawn</button><button class="btn" data-act="sheet-close">Cancel</button></div>`;
  } else if (sh.type === 'reveal') {
    const p = s.players[sh.i];
    inner = `<h2>Reveal ${esc(p.name)}'s Secret Objective?</h2><p>Everyone will see it. Only do this when the card tells you to, or at the end of the game.</p><div class="row"><button class="btn danger" data-act="reveal-do" data-i="${sh.i}">Reveal</button><button class="btn" data-act="sheet-close">Cancel</button></div>`;
  } else if (sh.type === 'unit') {
    inner = renderUnitSheet(sh.raw);
  } else if (sh.type === 'secwho') {
    const c = SEC[sh.id];
    inner = `<h2>${esc(c.name)} succeeded</h2><p class="small">${esc(c.rew)}</p><p>Which player's unit triggered it? If several did, pick one of them at random.</p>
      <div class="row">${s.players.map((p, i) => `<button class="btn primary" data-act="secwho-do" data-i="${i}">${esc(p.name)}</button>`).join('')}${c.rewFx.nobody ? `<button class="btn" data-act="secwho-do" data-i="-1">Nobody (+2 SP each instead)</button>` : ''}</div><button class="btn" data-act="sheet-close">Cancel</button>`;
  } else if (sh.type === 'replace') {
    inner = `<h2>Advanced Tactics: replace which mission?</h2><div class="cards">${s.decks.secondary.active.map(id => `<div>${secondaryCard(id)}<button class="btn primary sm" style="margin-top:6px" data-act="sec-redraw" data-id="${id}">Replace this one</button></div>`).join('')}</div><button class="btn" data-act="sheet-close">Later (use the Cards tab)</button>`;
  } else if (sh.type === 'perk') {
    const sv = s.saved[sh.idx];
    if (!sv) { ui.sheet = null; return ''; }
    const perk = perkOf(sv);
    const owner = s.players[sv.owner];
    let body;
    if (!perk) body = `<p>${esc(SEC[sv.id].rew)}</p>`;
    else if (perk.cancelMisery) {
      const active = s.decks.misery.active;
      body = active.length ? `<div class="cards">${active.map(id => `<div>${miseryCard(id)}<button class="btn primary sm" style="margin-top:6px" data-act="perk-cancel" data-mid="${id}">Cancel this card</button></div>`).join('')}</div><p class="small muted">One-off effects that already happened (lost SP, extra cards) stay: undo them by hand if you agree to.</p>` : '<p class="sub">No Misery card is active right now.</p>';
    } else if (perk.discount) {
      const item = SHOP[perk.item];
      const reason = shopCheck(s, item, sv.owner, 0, { discount: perk.discount });
      body = `<div class="row"><button class="btn primary" data-act="perk-discount" ${reason ? 'disabled' : ''}>Buy ${esc(item.name)} for ${Math.max(0, shopPrice(s, item, sv.owner, 0) - perk.discount)} SP</button></div>${reason ? `<p class="small" style="color:var(--bad)">${esc(reason)}</p>` : ''}`;
    } else {
      const items = (perk.tag ? RESUPPLY.filter(it => it.tags.includes(perk.tag)) : [SHOP[perk.item]]);
      body = `<div class="roster">${items.map(it => {
        const x = it.price === 'X' ? (Number(s.secX['shop:' + it.id]) || 1) : 0;
        const reason = shopCheck(s, it, sv.owner, x, { free: true });
        const buttons = it.auto === 'share' ? s.players.map((p, i) => i === sv.owner ? '' : `<button class="btn primary sm" data-act="perk-free" data-item="${it.id}" data-to="${i}" ${reason ? 'disabled' : ''}>Give ${esc(p.name)} 2 SP</button>`).join('')
          : `<button class="btn primary sm" data-act="perk-free" data-item="${it.id}" ${reason ? 'disabled' : ''}>Take free${it.price === 'X' ? ' (X=' + x + ')' : ''}</button>`;
        return `<div class="rost"><div class="grow"><b>${esc(it.name)}</b>${reason ? `<div class="small" style="color:var(--bad)">${esc(reason)}</div>` : ''}</div><div class="row">${buttons}</div></div>`;
      }).join('')}</div>${items.some(it => it.price === 'X') ? '<p class="small muted">X comes from the X box in the shop.</p>' : ''}`;
    }
    inner = `<h2>${esc(SEC[sv.id].name)}</h2><p><b>${esc(owner.name)}:</b> ${esc(perk ? perkLabel(perk) : 'saved reward')}${sv.left != null ? ' (' + sv.left + ' left)' : ''}. Normally used in a Resupply step.</p>${body}
      <div class="row"><button class="btn danger sm" data-act="perk-drop">Discard it unused</button><button class="btn" data-act="sheet-close">Close</button></div>`;
  }
  return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
}

function render() {
  const root = document.documentElement;
  if (state.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', state.theme);
  document.body.dataset.who = whoNow();
  const views = { turn: renderTurn, horde: renderHorde, cards: renderCards, players: renderPlayers, setup: renderSetup };
  $('#tracker').innerHTML = renderTracker();
  $('#main').innerHTML = (views[state.tab] || renderTurn)();
  $('#tabbar').innerHTML = renderTabbar();
  $('#sheet-root').innerHTML = renderSheet();
}

/* ============================== EVENTS ============================== */
function applySetup(s, key, value) {
  const locked = s.stage !== 'setup';
  if (['points', 'players', 'rounds', 'hard'].includes(key) && locked) return;
  if (key === 'points') { s.setup.points = Number(value); makeZones(s); }
  else if (key === 'players') { s.setup.players = Number(value); syncPlayers(s); resetSecrets(s); }
  else if (key === 'rounds') s.setup.rounds = value === 'inf' ? 'inf' : Number(value);
  else if (key === 'hard') s.setup.hard = value === '1';
  else if (key === 'sheet') s.setup.sheet = value;
  else if (key === 'allow13') s.setup.allow13 = value === '1';
  else if (key === 'excludeTraitor') { s.setup.excludeTraitor = value === '1'; if (!locked) resetSecrets(s); }
}
/* The Secret Objective deck depends on the player count and the Traitor switch. Changing either during setup takes back
   any dealt cards, so they can be dealt again from the right deck. */
function resetSecrets(s) {
  const wasDealt = s.secretDealt;
  s.decks.secret = buildDecks(s).secret;
  s.players.forEach((p, i) => { p.secret = newPlayer(i).secret; });
  s.secretDealt = false;
  if (wasDealt) addLog(s, 'Secret Objectives taken back: deal them again');
}
function setTab(tab) {
  state.tab = tab; ui.peek = null;
  store.set(JSON.stringify(state));
  render();
  window.scrollTo(0, 0);
}
/* Changes that are not worth an undo step (ticks, typing a name). */
function quiet(change) {
  change(state);
  store.set(JSON.stringify(state));
  render();
}

const ACTIONS = {
  tab: d => setTab(d.tab),
  next: () => { if (setupSpawnUnfinished()) { ui.sheet = { type: 'startearly' }; render(); } else mutate(advance); },
  'startearly-do': () => { ui.sheet = null; mutate(advance); },
  back: () => mutate(retreat),
  undo: () => undo(),
  goto: d => mutate(s => { s.stage = d.stage; }),
  tick: d => quiet(s => { s.ticks[d.k] = !s.ticks[d.k]; }),
  deal: () => mutate(dealSecrets),
  roundstart: () => mutate(runRoundStart),
  'r-discard': () => mutate(stepDiscardMisery),
  'r-misery': () => mutate(stepRevealMisery),
  'r-secondary': () => mutate(stepRevealSecondary),
  'm-draw': () => mutate(s => revealMisery(s, 1)),
  'm-discard': () => mutate(discardActiveMisery),
  's-draw': () => mutate(s => { revealSecondary(s); }),
  obj: d => quiet(s => { s.objectives = Math.max(0, s.objectives + Number(d.d)); }),
  income: () => mutate(s => { gainAll(s, s.objectives + (s.standing.fob ? 1 : 0)); s.ticks['p-command:2'] = true; addLog(s, 'SP income: ' + (s.objectives + (s.standing.fob ? 1 : 0)) + ' each'); }),
  'sec-ok': d => {
    const card = SEC[d.id];
    const problem = xProblem(card, missionX(state, d.id));
    if (problem) { toast(problem); return; }
    if ((rewardNeedsPlayer(card) && state.players.length > 1) || card.rewFx.nobody) { ui.sheet = { type: 'secwho', id: d.id }; render(); return; }
    mutate(s => resolveSecondary(s, d.id, true, missionX(s, d.id), 0));
    toast(card.name + ' succeeded. Reward: ' + card.rew);
  },
  'secwho-do': d => {
    const id = ui.sheet.id;
    ui.sheet = null;
    mutate(s => resolveSecondary(s, id, true, missionX(s, id), Number(d.i)));
    toast(SEC[id].name + ' succeeded. Reward: ' + SEC[id].rew);
  },
  'sec-fail': d => { const card = SEC[d.id]; mutate(s => resolveSecondary(s, d.id, false, missionX(s, d.id))); toast(card.name + ' failed. Punishment: ' + card.pen); },
  'sec-drop': d => mutate(s => discardSecondary(s, d.id)),
  'sec-redraw': d => { ui.sheet = null; mutate(s => redrawSecondary(s, d.id)); },
  manual: d => quiet(s => { s.manualMod += Number(d.d); }),
  rollzone: d => mutate(s => rollZone(s, d.z)),
  pick: d => mutate(s => pickUnit(s, d.z, Number(d.s), d.raw)),
  random: d => {
    const z = zoneOf(state, d.z);
    const slot = z.slots.find(sl => sl.id === Number(d.s));
    if (!rankOptions(slot.bracket, z.seed + ':' + slot.id).some(o => o.available)) { toast('No available option in this bracket'); return; }
    mutate(s => drawRandom(s, d.z, Number(d.s)));
  },
  'draft-accept': d => mutate(s => acceptDraft(s, d.z, Number(d.s))),
  'draft-cancel': d => mutate(s => cancelDraft(s, d.z, Number(d.s))),
  replace: d => mutate(s => replaceUnit(s, d.z, Number(d.s))),
  rolldown: d => mutate(s => rollDownSlot(s, d.z, Number(d.s))),
  exp: d => { ui.exp[d.k] = !ui.exp[d.k]; render(); },
  sheet: d => { ui.sheet = { type: d.type, uid: Number(d.uid), i: Number(d.i), idx: Number(d.idx), raw: d.raw, id: d.id }; render(); },
  'sheet-close': (d, el, e) => { if (e.target !== el) return; ui.sheet = null; render(); },
  'resetspawn-do': () => { ui.sheet = null; mutate(resetSpawn); },
  'destroy-by': d => { const uid = ui.sheet.uid; ui.sheet = null; mutate(s => destroyUnit(s, uid, Number(d.i))); },
  buyer: d => quiet(s => { s.buyer = Number(d.i); }),
  shoptag: d => { ui.shopTag = d.tag; render(); },
  buy: d => {
    const item = SHOP[d.id];
    const pi = Math.min(state.buyer, state.players.length - 1);
    const x = item.price === 'X' ? (Number(state.secX['shop:' + item.id]) || 1) : 0;
    const reason = shopCheck(state, item, pi, x);
    if (reason) { toast(reason); return; }
    if (item.auto === 'share') { ui.sheet = { type: 'share', pi, id: item.id }; render(); return; }
    mutate(s => { payFor(s, item, pi, x); completePurchase(s, item, pi); });
    if (item.auto === 'replace-secondary' && state.decks.secondary.active.length > 1) { ui.sheet = { type: 'replace' }; render(); return; }
    toast(item.auto === 'plans' ? 'Bought. Open the Players tab to choose a Secret Objective.' : 'Bought ' + item.name + '. ' + item.text);
  },
  'perk-free': d => {
    const idx = ui.sheet.idx;
    const sv = state.saved[idx];
    const item = SHOP[d.item];
    const x = item.price === 'X' ? (Number(state.secX['shop:' + item.id]) || 1) : 0;
    const reason = shopCheck(state, item, sv.owner, x, { free: true });
    if (reason) { toast(reason); return; }
    mutate(s => useSavedFree(s, idx, item.id, x, Number(d.to)));
    if (!state.saved.includes(sv)) ui.sheet = null;
    if (item.auto === 'replace-secondary' && state.decks.secondary.active.length > 1) ui.sheet = { type: 'replace' };
    render();
    toast(item.name + ' taken free. ' + item.text);
  },
  'perk-discount': () => { const idx = ui.sheet.idx; ui.sheet = null; mutate(s => useSavedDiscount(s, idx)); },
  'perk-cancel': d => { const idx = ui.sheet.idx; ui.sheet = null; mutate(s => useSavedCancel(s, idx, d.mid)); },
  'perk-drop': () => { const idx = ui.sheet.idx; ui.sheet = null; mutate(s => { const sv = spendSaved(s, idx); addLog(s, s.players[sv.owner].name + ' discarded ' + SEC[sv.id].name + ' unused'); }); },
  'share-do': d => { const { pi, id } = ui.sheet; ui.sheet = null; mutate(s => { payFor(s, SHOP[id], pi, 0); gainSP(s, Number(d.to), 2); }); },
  unstand: d => mutate(s => { if (STANDING_COUNTED[d.k]) { s.standing[d.k] -= 1; if (s.standing[d.k] <= 0) delete s.standing[d.k]; } else delete s.standing[d.k]; }),
  cp: d => mutate(s => { const p = s.players[Number(d.i)]; p.cp = Math.max(0, p.cp + Number(d.d)); }),
  sp: d => mutate(s => { const i = Number(d.i); if (Number(d.d) > 0) gainSP(s, i, 1); else s.players[i].sp = Math.max(0, s.players[i].sp - 1); }),
  peek: d => { ui.peek = Number(d.i); clearTimeout(ui.peekTimer); ui.peekTimer = setTimeout(() => { ui.peek = null; render(); }, 10000); render(); },
  hide: () => { ui.peek = null; render(); },
  keep: d => { ui.peek = null; mutate(s => keepSecret(s, Number(d.i), d.id)); },
  'reveal-do': d => { ui.sheet = null; ui.peek = null; mutate(s => { const p = s.players[Number(d.i)]; p.secret.revealed = true; addLog(s, p.name + ' revealed ' + OBJ[p.secret.kept].name); }); },
  set: d => mutate(s => applySetup(s, d.k, d.v)),
  theme: d => quiet(s => { s.theme = d.v; }),
  'newgame-do': () => { state = freshGame({ setup: state.setup, collection: state.collection, theme: state.theme }); undoStack.length = 0; ui.sheet = null; ui.peek = null; store.set(JSON.stringify(state)); render(); window.scrollTo(0, 0); },
};
ui.exp = {};
ui.shopTag = 'All';

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const action = ACTIONS[el.dataset.act];
  if (action) action(el.dataset, el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const d = el.dataset;
  const number = Number(el.value);
  switch (d.change) {
    case 'die': mutate(s => setDie(s, d.z, Number(d.i), number)); break;
    case 'removed': mutate(s => setZoneCleared(s, d.z, el.value)); break;
    case 'shopx': quiet(s => { s.secX['shop:' + d.id] = Math.max(1, Math.floor(number) || 1); }); break;
    case 'secx': quiet(s => { s.secX[d.id] = Math.max(0, Math.floor(number) || 0); }); break;
    case 'pname': quiet(s => { s.players[Number(d.i)].name = el.value.trim() || 'Player ' + (Number(d.i) + 1); }); break;
    case 'coll': quiet(s => { if (el.value === '') delete s.collection[d.key]; else s.collection[d.key] = Math.max(0, Math.floor(number) || 0); }); break;
    default: break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); }
});

render();
</script>
</body>
</html>

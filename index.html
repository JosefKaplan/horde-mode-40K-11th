<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Horde Mode 40K</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c110f'/%3E%3Cpath d='M32 9 52 21v22L32 55 12 43V21z' fill='none' stroke='%234ee39a' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%234ee39a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Cogitator CRT: the whole app is one military terminal screen in a bezel. The phosphor colour (--ph) says whose turn it is:
   green for the Horde (and setup), amber for the players. CP, SP and bad keep their own tints so they read at a glance.
   Tokens live on body because they are mixed from --ph. Light theme = a teleprinter paper printout. */
:root { color-scheme: dark; --bezel: #0d0e0c; }
:root[data-theme="light"] { color-scheme: light; --bezel: transparent; }
body {
  --ph: #3dff8b; --ph-hi: #c8ffdc;
  --font-display: "VT323", "Share Tech Mono", ui-monospace, monospace;
  --font-mono: "VT323", "Share Tech Mono", ui-monospace, monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 0; --glow-alpha: 45%;
  --cp: #7ee8ff; --sp: #d3b4ff; --bad: #ff5b4d; --warn: #ffd25a;
}
body[data-who="players"] { --ph: #ffb000; --ph-hi: #ffe7b0; }
body {
  --bg: color-mix(in srgb, var(--ph) 4%, #020403);
  --surface: color-mix(in srgb, var(--ph) 7%, #030504);
  --surface-2: color-mix(in srgb, var(--ph) 11%, #040605);
  --ink: color-mix(in srgb, var(--ph) 70%, var(--ph-hi));
  --muted: color-mix(in srgb, var(--ph) 62%, #050505);
  --line: color-mix(in srgb, var(--ph) 28%, transparent);
  --line-hi: color-mix(in srgb, var(--ph) 50%, transparent);
  --turn: var(--ph); --turn-soft: color-mix(in srgb, var(--ph) 16%, transparent);
  --horde: var(--ph); --horde-soft: color-mix(in srgb, var(--ph) 16%, transparent); --good: var(--ph);
  --ply: var(--ph); --ply-soft: color-mix(in srgb, var(--ph) 16%, transparent);
  --cp-soft: color-mix(in srgb, var(--cp) 14%, transparent); --sp-soft: color-mix(in srgb, var(--sp) 14%, transparent);
  --bad-soft: color-mix(in srgb, var(--bad) 16%, transparent); --warn-soft: color-mix(in srgb, var(--warn) 14%, transparent);
  --on-turn: #020403; --scan: rgba(0, 0, 0, .35);
  --glow: 0 0 8px color-mix(in srgb, var(--ph) var(--glow-alpha), transparent);
}
/* Paper printout: dark ink on green-bar teleprinter paper, no bezel, no glow, no scanlines. */
:root[data-theme="light"] body {
  --ph: #0f5a32; --ph-hi: #0f5a32; --cp: #14557f; --sp: #5a3197; --bad: #a3170f; --warn: #7d4a00;
  --bg: #f3f1e8; --surface: #fbfaf5; --surface-2: #efede2; --ink: #1d1f1a; --muted: #5d6157;
  --line: #c8c4b2; --line-hi: #8f8a74; --on-turn: #fbfaf5; --scan: transparent; --glow-alpha: 0%;
}
:root[data-theme="light"] body[data-who="players"] { --ph: #7a4b00; --ph-hi: #7a4b00; }

* { box-sizing: border-box; }
html { background: var(--bezel); }
html, body { margin: 0; }
body {
  color: var(--ink); font-family: var(--font-body), sans-serif; font-size: 15px; line-height: 1.45;
  background-color: var(--bg);
  background-image: radial-gradient(ellipse 110% 70% at 50% 40%, color-mix(in srgb, var(--ph) 9%, transparent), transparent 75%);
  background-attachment: fixed;
  text-shadow: 0 0 5px color-mix(in srgb, var(--ph) calc(var(--glow-alpha) * .6), transparent);
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  transition: background-color .4s;
}
:root[data-theme="light"] body {
  background-image: repeating-linear-gradient(180deg, transparent 0 48px, color-mix(in srgb, var(--ph) 7%, transparent) 48px 96px);
  background-attachment: scroll;
}
/* The screen: rounded glass inside the bezel, vignette and a faint reflection. Never takes taps. */
body::before {
  content: ""; position: fixed; inset: 5px; z-index: 60; pointer-events: none; border-radius: 22px;
  outline: 40px solid var(--bezel);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ph) 22%, transparent), inset 0 0 70px rgba(0, 0, 0, .75), inset 0 0 18px rgba(0, 0, 0, .6);
  background: linear-gradient(155deg, rgba(255, 255, 255, .045), transparent 32%);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: 59; pointer-events: none;
  background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);
}
:root[data-theme="light"] body::before, :root[data-theme="light"] body::after { display: none; }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-theme="light"]) { animation: crt-power-on .7s ease-out 1; }
  :root:not([data-theme="light"]) body::after { animation: crt-flicker 6s steps(1) infinite; }
  .who::after { animation: cursor-blink 1.1s steps(1) infinite; }
  .gcard.misery { animation: alert-border 1.6s steps(1) infinite; }
}
@keyframes crt-power-on { 0% { clip-path: inset(50% 0 50% 0); filter: brightness(3); } 45% { clip-path: inset(49.5% 0 49.5% 0); } 100% { clip-path: inset(0); filter: none; } }
@keyframes crt-flicker { 0%, 100% { opacity: 1; } 97% { opacity: .82; } 98% { opacity: 1; } }
@keyframes cursor-blink { 50% { opacity: 0; } }
@keyframes alert-border { 50% { border-color: color-mix(in srgb, var(--bad) 35%, transparent); } }

button, input, select { font: inherit; color: inherit; text-shadow: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--turn); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display), monospace; font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .06em; color: var(--ph); }
p { margin: 0; }
b { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---------- Tracker: the status bar ---------- */
.tracker {
  position: sticky; top: 0; z-index: 10; background: var(--surface);
  border-bottom: 3px double var(--line-hi);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 10px; display: grid; gap: 7px;
}
.tracker::before {
  content: "COGITATOR-XI \00B7  HORDE TACTICAL FEED"; font-family: var(--font-mono), monospace; font-size: 14px; letter-spacing: .12em;
  color: var(--muted); border-bottom: 1px dashed var(--line); padding-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
:root[data-theme="light"] .tracker::before { content: "TELEPRINTER COPY \00B7  HORDE TACTICAL FEED"; }
.tr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.who { font-family: var(--font-display), monospace; font-size: 24px; line-height: 1; color: var(--ph); letter-spacing: .08em; font-variant-caps: all-small-caps; text-shadow: var(--glow); min-width: 0; }
.who::before { content: "> "; }
.who::after { content: "\2588"; margin-left: 4px; font-size: .8em; }
.round { font-family: var(--font-mono), monospace; font-size: 19px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; font-variant-caps: all-small-caps; }
.round b { color: var(--ph); font-size: 22px; font-weight: 400; }
.mode-tag { font-family: var(--font-mono), monospace; font-size: 15px; letter-spacing: .1em; background: var(--bad); color: var(--on-turn); text-shadow: none; padding: 0 6px; margin-left: 6px; }
.pchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.pchips::-webkit-scrollbar { display: none; }
.pchip { flex: 0 0 auto; border: 1px solid var(--line-hi); background: transparent; padding: 1px 8px; font-family: var(--font-mono), monospace; font-size: 17px; display: flex; gap: 8px; align-items: center; }
.pchip .cp { color: var(--cp); }
.pchip .sp { color: var(--sp); }
.tr-nav { display: flex; gap: 8px; align-items: stretch; }
.navbtn { border: 1px solid var(--line-hi); background: transparent; padding: 4px 12px; min-width: 48px; font-family: var(--font-display), monospace; font-size: 20px; letter-spacing: .08em; }
.navbtn.next { background: var(--ph); color: var(--on-turn); border-color: var(--ph); flex: 1 1 auto; text-shadow: none; box-shadow: var(--glow); font-variant-caps: all-small-caps; }
.navbtn.next::before { content: "[ "; } .navbtn.next::after { content: " ]"; }
.navbtn:disabled { opacity: .35; cursor: default; }
.pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; padding: 0 8px; font-family: var(--font-mono), monospace; font-size: 17px; color: var(--muted); font-variant-caps: all-small-caps; }
.pill.horde, .pill.players { border-style: solid; }
.pill.players { border-style: dashed; }
.pill[aria-current="step"] { background: var(--ph); color: var(--on-turn); border-color: var(--ph); text-shadow: none; box-shadow: var(--glow); }
.pill.done { opacity: .45; }

/* ---------- Layout: boxes drawn like terminal frames ---------- */
main { padding: 14px 18px; display: grid; gap: 14px; max-width: 760px; margin: 0 auto; }
.panel, .zone, .gcard, .sheet { position: relative; }
.panel { background: var(--surface); border: 3px double var(--line-hi); padding: 12px 14px; display: grid; gap: 10px; }
.panel > h2 { font-size: 24px; line-height: 1.05; font-variant-caps: all-small-caps; text-shadow: var(--glow); }
.panel > h2::before { content: "\2590 "; }
.panel > h3 { font-size: 20px; font-variant-caps: all-small-caps; }
.panel.turnbar { border-color: var(--ph); }
.sub { color: var(--muted); font-size: 13px; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: start; }
/* Ticks read [ ] and [x]; the button's own ✓ is hidden. */
.tick { width: 34px; height: 20px; white-space: nowrap; text-align: left; border: 0; background: transparent; padding: 0; font-size: 0; font-family: var(--font-mono), monospace; color: var(--ph); }
.tick::before { content: "[ ]"; font-size: 19px; line-height: 20px; }
.tick[aria-pressed="true"]::before { content: "[x]"; }
.item.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.done .txt * { display: inline; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 3px double var(--line-hi); padding: 0 6px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab { border: 0; background: transparent; padding: 7px 2px 6px; display: grid; gap: 1px; justify-items: center; font-family: var(--font-mono), monospace; font-size: 17px; line-height: 1; letter-spacing: .06em; color: var(--muted); font-variant-caps: all-small-caps; }
.tab .ic { font-size: 16px; line-height: 1; }
.tab[aria-selected="true"] { background: var(--ph); color: var(--on-turn); text-shadow: none; box-shadow: var(--glow); }

/* ---------- Controls: terminal keys ---------- */
.btn { border: 1px solid var(--line-hi); background: transparent; padding: 7px 12px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--ph); background: var(--turn-soft); }
.btn.primary { background: var(--ph); color: var(--on-turn); border-color: var(--ph); font-weight: 600; text-shadow: none; box-shadow: var(--glow); }
.btn.primary:hover:not(:disabled) { background: var(--ph-hi); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line-hi); background: transparent; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ph); color: var(--on-turn); text-shadow: none; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 34px; height: 34px; border: 1px solid var(--line-hi); background: transparent; font-family: var(--font-mono), monospace; font-size: 22px; line-height: 1; }
.stepper .num { font-family: var(--font-mono), monospace; font-size: 30px; line-height: 1; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper.cp .num { color: var(--cp); }
.stepper.sp .num { color: var(--sp); }
input[type="text"], input[type="number"], select { border: 1px solid var(--line-hi); background: var(--bg); padding: 6px 8px; min-width: 0; border-radius: 0; }
input[type="number"] { width: 5.5em; }
select option, select optgroup { background: var(--bg); color: var(--ink); }
select { max-width: 100%; }
label.field { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
label.field .seg { justify-self: start; }
.coll-list { display: grid; gap: 6px; margin: 8px 0; }
.coll-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.coll-row input[type="number"] { width: 4.5em; }
.shoplist { display: grid; gap: 6px; }
.shoprow { border: 1px solid var(--line); border-left: 3px solid var(--ph); background: transparent; padding: 6px 8px; display: grid; gap: 4px; }
.shoprow.blocked { opacity: .5; }
.shophead { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.shophead .ft { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.hordephase { border-top: 1px dashed var(--line-hi); padding-top: 8px; display: grid; gap: 6px; }
.hordephase h3 { font-size: 20px; font-variant-caps: all-small-caps; }
.shophead > .row { flex: 0 0 auto; }
.shophead label { display: inline-flex; gap: 4px; align-items: center; }
.shophead input[type="number"] { width: 3.6em; }
.shophead .btn { white-space: nowrap; }
.chip { display: inline-block; padding: 0 6px; font-size: 12px; font-weight: 500; background: transparent; border: 1px solid var(--line-hi); }
.chip.good { background: var(--horde-soft); border-color: var(--ph); color: var(--ph); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip.cp { background: var(--cp-soft); border-color: var(--cp); color: var(--cp); }
.chip.sp { background: var(--sp-soft); border-color: var(--sp); color: var(--sp); }
.note { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 6px 10px; font-size: 13px; }
.note.bad { background: var(--bad-soft); border-left-color: var(--bad); }
.note.good { background: var(--horde-soft); border-left-color: var(--ph); }
details { border: 1px dashed var(--line-hi); padding: 6px 10px; background: transparent; }
summary { cursor: pointer; font-weight: 500; }
summary::marker { color: var(--ph); }

/* ---------- Game cards ---------- */
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.gcard { border: 1px solid var(--cardc, var(--line-hi)); background: var(--surface-2); padding: 8px 10px 10px; display: grid; gap: 4px; align-content: start; }
.gcard .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.gcard .no { font-family: var(--font-mono), monospace; color: var(--cardc, var(--muted)); font-size: 22px; line-height: 1; }
.gcard .no::before { content: "#"; opacity: .6; }
.gcard .nm { font-family: var(--font-display), monospace; font-size: 22px; line-height: 1; letter-spacing: .05em; font-variant-caps: all-small-caps; color: var(--cardc, var(--ph)); }
.gcard .ft { display: flex; gap: 4px; flex-wrap: wrap; }
.lbl { font-family: var(--font-mono), monospace; font-size: 17px; line-height: 1.1; letter-spacing: .1em; font-variant-caps: all-small-caps; color: var(--muted); margin-top: 2px; }
.lbl::before { content: "> "; color: var(--ph); }
.gcard.misery { --cardc: var(--bad); border-width: 2px; }
.gcard.misery .hd::before { content: "!! ALERT"; font-family: var(--font-mono), monospace; font-size: 17px; line-height: 1; background: var(--bad); color: var(--on-turn); text-shadow: none; padding: 0 5px; }
.gcard.secondary { --cardc: var(--cp); }
.gcard.secret { --cardc: var(--sp); }
.gcard.back { background: repeating-linear-gradient(0deg, var(--sp-soft) 0 2px, transparent 2px 6px); text-align: center; align-content: center; min-height: 96px; color: var(--sp); font-family: var(--font-mono), monospace; font-size: 20px; letter-spacing: .1em; }
.gcard.back::before { content: "CLASSIFIED \2588\2588\2588\2588"; font-size: 15px; opacity: .8; }
.gcard.big { border-width: 2px; }

/* ---------- Horde ---------- */
.zone { border: 1px solid var(--line-hi); border-left: 3px solid var(--ph); background: var(--surface-2); padding: 10px 12px; display: grid; gap: 10px; }
.zone > .row h3 { font-size: 22px; line-height: 1; font-variant-caps: all-small-caps; text-shadow: var(--glow); }
.zone.done { border-left-color: var(--muted); }
.dice { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.die { width: 3.2em; text-align: center; font-family: var(--font-mono), monospace; font-size: 20px; padding: 2px 4px; }
.calc { font-family: var(--font-mono), monospace; font-size: 19px; line-height: 1.25; }
.calc .total { display: inline-block; min-width: 1.6em; padding: 0 6px; text-align: center; font-size: 30px; line-height: 1.05; background: var(--ph); color: var(--on-turn); text-shadow: none; box-shadow: var(--glow); }
.slot { border: 1px dashed var(--line-hi); padding: 8px; display: grid; gap: 8px; background: transparent; }
.opt { border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.opt:hover { border-color: var(--line-hi); }
.opt .rk { font-family: var(--font-mono), monospace; font-size: 26px; line-height: 1; color: var(--ph); text-align: center; text-shadow: var(--glow); }
.opt.na { opacity: .5; }
.opt .nm { font-weight: 600; overflow-wrap: anywhere; }
.reasons { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.draft { border: 2px solid var(--ph); background: var(--turn-soft); padding: 10px; display: grid; gap: 8px; }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: inherit; text-align: left; text-decoration: underline; text-decoration-color: var(--line-hi); text-underline-offset: 3px; overflow-wrap: anywhere; }
.linkbtn:hover { text-decoration-color: var(--ph); color: var(--ph-hi); }
.wpn { border-top: 1px dashed var(--line); padding: 4px 0; display: grid; gap: 2px; }
.wstats { display: flex; flex-wrap: wrap; gap: 0 10px; font-family: var(--font-mono), monospace; font-size: 18px; color: var(--muted); }
table.stats { font-family: var(--font-mono), monospace; font-size: 20px; width: auto; }
table.stats th { color: var(--muted); font-weight: 400; font-size: 16px; letter-spacing: .08em; text-align: center; padding: 0 6px; }
table.stats td { text-align: center; padding: 0 6px; color: var(--ph); }
.bul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.bul li::marker { color: var(--ph); content: "\25B8  "; }
details > .bul { margin-top: 6px; }
.roster { display: grid; gap: 6px; }
.rost { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-left: 3px solid var(--ph); padding: 6px 10px; background: transparent; }

/* ---------- Sheet / toast ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .7); display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--bg); width: min(100%, 520px); border: 3px double var(--ph); border-bottom: 0; padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 85vh; overflow: auto; }
.sheet h2 { font-size: 24px; line-height: 1.05; font-variant-caps: all-small-caps; text-shadow: var(--glow); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--bg); color: var(--ph); border: 1px solid var(--ph); padding: 6px 14px; font-family: var(--font-mono), monospace; font-size: 18px; max-width: calc(100vw - 36px); text-align: center; box-shadow: var(--glow); }
.toast::before { content: "> "; }
.toast[hidden] { display: none; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px dashed var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-family: var(--font-mono), monospace; font-size: 17px; line-height: 1.2; }
.log li { border-bottom: 1px dashed var(--line); padding: 2px 0; }
.log li::before { content: "> "; color: var(--ph); }
</style>
</head>
<body>

/* A spawn-table cell like "Immortals (10) + Imotekh the Stormlord + Chronomancer" becomes a plain object. Any part may
   carry a size: "Chosen (10) + Abaddon the Despoiler + Masters of the Maelstrom (5)". */
const entryCache = new Map();
function parseEntry(raw) {
  if (entryCache.has(raw)) return entryCache.get(raw);
  const sized = part => { const m = part.match(/^(.*?)\s*\((\d+)\)$/); return m ? { name: m[1], size: Number(m[2]), shown: true } : { name: part, size: 1, shown: false }; };
  const parts = raw.split(/\s+\+\s+/).map(p => p.trim());
  const base = sized(parts[0]);
  const extras = parts.slice(1);
  const placeholders = extras.filter(e => PLACEHOLDERS.includes(e.toLowerCase()));
  const namedParts = extras.filter(e => !PLACEHOLDERS.includes(e.toLowerCase())).map(sized);
  const named = namedParts.map(n => n.name);
  const baseKey = entryKey(base.name);
  const need = { [baseKey]: base.size };
  namedParts.forEach(n => { const k = entryKey(n.name); need[k] = (need[k] || 0) + n.size; });
  const label = pretty(base.name) + (base.shown ? ' (' + base.size + ')' : '') + extras.map(x => ' + ' + (PLACEHOLDERS.includes(x.toLowerCase()) ? x : pretty(x))).join('');
  const entry = { raw, baseName: base.name, baseKey, size: base.size, placeholders, named, need, label, lastResort: lastResortOf(baseKey) };
  entryCache.set(raw, entry);

}
/* Every unit name that appears in the tables, for the collection editor. */
let catalogCache = null;
function catalog() {
  if (catalogCache) return catalogCache;
  const names = new Map();
  for (const sheet of ['standard', 'detailed']) {
    for (const bracket of BRACKET_KEYS) {
      for (const raw of SPAWN[sheet][bracket]) {
        const e = parseEntry(raw);
        [e.baseName, ...e.named].forEach(n => { const k = entryKey(n); if (!names.has(k)) names.set(k, pretty(n)); });
      }
    }

  catalogCache = [...names.entries()].map(([key, name]) => ({ key, name })).sort((a, b) => a.name.localeCompare(b.name));
  return catalogCache;
}

function tableSizes(key) {

const sameWeapon = name => name.toLowerCase().replace(/’/g, "'").split(/ [–-] /)[0].trim().replace(/s$/, '');

function loadouts(u) {
  const modelCount = (u.loadouts || []).reduce((total, lo) => total + lo.n, 0) || 1;
  const everything = [{ n: modelCount, ranged: u.ranged || [], melee: u.melee || [] }];
  if (!u.loadouts) return everything;
  const list = u.loadouts.map(lo => {
    const items = lo.items.map(sameWeapon);
    const carried = weapons => (weapons || []).filter(w => items.includes(sameWeapon(w.n)));

  [w => w.kw.includes('PRECISION') && 'PRECISION', () => 'shoots the closest visible unit with a Leader or Support model first'],

function hordeProfile(key) {

  const meleeBetter = [...new Set(los.flatMap(lo => lo.melee.filter(betterMelee).map(w => w.n)))];

  if (id === 's14') return 'App count: ' + tagBuys('Supply') + ' Supply purchases this round.';
  if (id === 's07') { const n = s.horde.reduce((total, h) => total + entryCharacters(parseEntry(h.raw)).length, 0); return 'Horde CHARACTER models on the table: ' + n + '.'; }
  if (id === 's08') { const n = s.horde.filter(h => entryHasVehicleOrMonster(parseEntry(h.raw))).length; return 'Horde VEHICLE or MONSTER units on the table: ' + n + '.'; }
  if (id === 's17') return 'Fortified objectives (app markers): ' + Object.keys(STANDING).filter(k => s.standing[k]).length + '.';
  return '';
}

/* ---- Resupply shop ---- */
function shopPrice(s, item, playerIndex, x) {
  let price = item.price === 'X' ? x : item.price;
  if (activeMisery('m24', s)) price *= 2;
  if (s.rnd.lz && !s.players[playerIndex].lzUsed) price = Math.max(0, price - 3);
  return price;
}
const boughtKey = (s, item, pi) => s.round + ':' + item.id + (item.once === 'turnPlayer' ? ':' + pi : '');
/* Returns a reason the purchase is not possible, or '' when it is.
   opts.free: a saved reward pays for it; opts.discount: SP taken off the price. */
function shopCheck(s, item, pi, x, opts = {}) {
  const p = s.players[pi];
  if (!p) return 'Pick a player';
  if (s.removedShop.includes(item.id)) return item.name + ' was removed from the shop';
  const has = tag => item.tags.includes(tag);
  if (activeMisery('m21', s) && has('Fortify')) return 'Bunkers Busted: no Fortify purchases';
  if (activeMisery('m22', s) && (has('Supply') || has('Spawn') || has('Strike'))) return 'Comms Jammed: no Supply, Spawn or Strike purchases';
  if (activeMisery('m23', s) && has('Tactics')) return 'The Mind Killer: no Tactics purchases';
  if (activeMisery('m29', s) && has('Secondary')) return "Fate's Fetters: no Secondary purchases";
  if (item.price === 'X' && !(Number.isInteger(x) && x >= 1)) return 'Enter X (1 or more)';
  const price = opts.free ? 0 : Math.max(0, shopPrice(s, item, pi, x) - (opts.discount || 0));
  if (p.sp < price) return p.name + ' needs ' + price + ' SP (has ' + p.sp + ')';
  if (item.once && s.bought[boughtKey(s, item, pi)]) return item.name + ' was already bought this round';
  if (item.stand && s.standing[item.stand]) return STANDING[item.stand].name + ' already exists (only one at a time)';
  if (item.id === 'mine' && s.standing.mine) return 'A Minefield already exists';
  if (item.auto === 'plans') {
    if (s.setup.rounds === 'inf') return 'No Secret Objectives in an infinite game';
    if (!p.secret.kept) return p.name + ' has no kept Secret Objective to replace';
    if (p.secret.revealed) return p.name + "'s Secret Objective is already revealed";
  }
  if (item.auto === 'second-mission' && s.decks.secondary.active.length >= 2) return 'Two Secondary Missions are already active';
  if (item.auto === 'share' && s.players.length < 2) return 'No other player to give SP to';
  if (item.auto === 'replace-secondary' && !s.decks.secondary.active.length) return 'No active Secondary Mission to replace';
  return '';
}
function payFor(s, item, pi, x, discount = 0) {
  const p = s.players[pi];
  const price = Math.max(0, shopPrice(s, item, pi, x) - discount);
  p.sp -= price;
  if (s.rnd.lz && !p.lzUsed) p.lzUsed = true;
  if (item.once) s.bought[boughtKey(s, item, pi)] = true;
  s.buys.push({ seq: s.uid++, pi, item: item.id, sp: price, tags: item.tags });
  addLog(s, p.name + ' bought ' + item.name + (item.price === 'X' ? ' (X=' + x + ')' : '') + ' for ' + price + ' SP');
}
/* A purchase paid for by a saved reward card: no SP, but limits and Misery restrictions still apply. */
function takeFree(s, item, pi, x, cardName, to) {
  if (item.once) s.bought[boughtKey(s, item, pi)] = true;
  if (item.auto === 'share') gainSP(s, to, 2);
  s.buys.push({ seq: s.uid++, pi, item: item.id, sp: 0, tags: item.tags });
  addLog(s, s.players[pi].name + ' took ' + item.name + ' free (' + cardName + ')');
  completePurchase(s, item, pi);
}
function completePurchase(s, item, pi) {
  const p = s.players[pi];
  if (item.auto === 'cp') p.cp += 1;
  if (item.auto === 'second-mission') revealSecondary(s);
  if (item.auto === 'plans') startChangeOfPlans(s, pi);
  if (item.auto === 'replace-secondary' && s.decks.secondary.active.length === 1) redrawSecondary(s, s.decks.secondary.active[0]);
  if (item.stand) s.standing[item.stand] = true;
  if (item.count) { const [key, max] = item.count; s.standing[key] = Math.min(max, (s.standing[key] || 0) + 1); }
}

/* ---- Saved reward cards (Secondary Mission rewards a player keeps for later) ---- */
const perkOf = sv => sv.perk || SEC[sv.id].perk || null;
function perkLabel(perk) {
  if (!perk) return '';
  if (perk.cancelMisery) return 'Cancel one revealed Misery card';
  if (perk.tag) return 'One free ' + perk.tag + ' purchase';
  if (perk.discount) return SHOP[perk.item].name + ' costs ' + perk.discount + ' SP less';
  return perk.uses > 1 ? 'Up to ' + perk.uses + ' free ' + SHOP[perk.item].name : 'One free ' + SHOP[perk.item].name;
}
/* The card leaves the player: a saved card goes to the Secondary discard pile, a handed-out freebie just ends. */
function spendSaved(s, idx) {
  const [sv] = s.saved.splice(idx, 1);
  if (sv && !sv.perk) s.decks.secondary.discard.push(sv.id);
  return sv;
}
function useSavedFree(s, idx, itemId, x, to) {
  const sv = s.saved[idx];
  takeFree(s, SHOP[itemId], sv.owner, x, SEC[sv.id].name, to);
  sv.left = (sv.left == null ? (perkOf(sv).uses || 1) : sv.left) - 1;
  if (sv.left <= 0) spendSaved(s, idx);
}
function useSavedDiscount(s, idx) {
  const sv = s.saved[idx];
  const perk = perkOf(sv);
  const item = SHOP[perk.item];
  payFor(s, item, sv.owner, 0, perk.discount);
  completePurchase(s, item, sv.owner);
  spendSaved(s, idx);
}
function useSavedCancel(s, idx, miseryId) {
  const sv = s.saved[idx];
  const deck = s.decks.misery;
  deck.active = deck.active.filter(id => id !== miseryId);
  deck.discard.push(miseryId);
  addLog(s, s.players[sv.owner].name + ' used ' + SEC[sv.id].name + ' to cancel ' + MIS[miseryId].name);
  spendSaved(s, idx);
}

/* ---- Secret Objectives ---- */
function dealSecrets(s) {
  s.players.forEach(p => {
    const take = Math.min(2, s.decks.secret.draw.length);
    p.secret = { choices: take ? s.decks.secret.draw.splice(-take) : [], kept: null, revealed: false };
  });
  s.secretDealt = true;
  addLog(s, 'Secret Objectives dealt');
}
function keepSecret(s, pi, id) {
  const p = s.players[pi];
  const rest = p.secret.choices.filter(c => c !== id);
  s.decks.secret.draw = shuffle([...s.decks.secret.draw, ...rest]);
  p.secret = { choices: [], kept: id, revealed: false };
}
function startChangeOfPlans(s, pi) {
  const p = s.players[pi];
  const take = Math.min(2, s.decks.secret.draw.length);
  const fresh = take ? s.decks.secret.draw.splice(-take) : [];
  p.secret = { choices: [p.secret.kept, ...fresh], kept: null, revealed: false };
}
/* Establish Orbital Comms: every player with a kept, unrevealed objective uses A Change of Plans for free.
   atRandom (the punishment): the app picks among the old card and the drawn ones, so nobody sees them. Returns the count. */
function changeOfPlansForAll(s, atRandom) {
  if (s.setup.rounds === 'inf') return 0;
  let changed = 0;
  s.players.forEach((p, pi) => {
    if (!p.secret.kept || p.secret.revealed) return;
    startChangeOfPlans(s, pi);
    if (atRandom) keepSecret(s, pi, p.secret.choices[randInt(p.secret.choices.length)]);
    changed += 1;
  });
  return changed;
}

/* ---- Zones and roster ---- */
const zoneOf = (s, zoneId) => s.zones.find(z => z.id === zoneId);
function setDie(s, zoneId, index, value) {
  const z = zoneOf(s, zoneId);
  const needed = diceNeeded(s);
  if (!z.dice || z.dice.length !== needed) z.dice = Array(needed).fill(0);
  z.dice[index] = value;
  if (z.dice.every(d => d) && !s.zones.some(o => o.usedFirst)) z.usedFirst = true;
  rebuildSlots(z, s);
}
function rollZone(s, zoneId) {
  const z = zoneOf(s, zoneId);
  z.dice = Array.from({ length: diceNeeded(s) }, rollD6);
  if (!s.zones.some(o => o.usedFirst)) z.usedFirst = true;
  rebuildSlots(z, s);
}
function pickUnit(s, zoneId, slotId, raw) {
  const z = zoneOf(s, zoneId);
  const slot = z.slots.find(sl => sl.id === slotId);
  if (!slot || slot.filled) return;
  slot.filled = raw;
  const e = parseEntry(raw);
  const zoneNo = z.extra ? 0 : s.zones.filter(o => !o.extra).indexOf(z) + 1;
  s.horde.push({ uid: s.uid++, zone: zoneId, zoneNo, round: effRound(s), raw, baseKey: e.baseKey, need: e.need, bracket: slot.bracket });
  addLog(s, 'Spawned ' + e.label + ' ' + bracketLabel(slot.bracket));
}
function rollDownSlot(s, zoneId, slotId) {
  const z = zoneOf(s, zoneId);
  const i = z.slots.findIndex(sl => sl.id === slotId);
  if (i < 0) return;
  const slot = z.slots[i];
  const lower = BRACKET_KEYS.indexOf(slot.bracket) - 1;
  if (slot.filled || lower < 0) return;
  z.slots.splice(i, 1,
    { id: z.ns++, bracket: BRACKET_KEYS[lower], filled: null, draft: null, rejected: [] },
    { id: z.ns++, bracket: BRACKET_KEYS[lower], filled: null, draft: null, rejected: [] });
}
/* by: a player index, 'zone' (cleared from a Spawn Zone) or 'none'. Destroyed units are kept for the Warlord and mission counts. */
function destroyUnit(s, uid, playerIndex, by) {
  const i = s.horde.findIndex(h => h.uid === uid);
  if (i < 0) return;
  const unit = s.horde[i];
  s.horde.splice(i, 1);
  s.destroyed.push(Object.assign({}, unit, { dRound: s.round, by: playerIndex >= 0 ? playerIndex : (by || 'none'), seq: s.uid++ }));
  const label = parseEntry(unit.raw).label;
  addLog(s, by === 'zone' ? label + ' cleared from a Spawn Zone (no SP)' : 'Destroyed ' + label + (playerIndex >= 0 ? ' (+1 SP ' + s.players[playerIndex].name + ')' : ''));
  if (playerIndex >= 0) gainSP(s, playerIndex, 1);
}

/* Rules 4 step 2, Clear Spawn Zone. value: '' (nothing cleared), 'u:<uid>' (that Horde unit is destroyed, no SP)
   or 'b:<bracket>' (a unit the app does not know). A unit cleared earlier is put back first, so changing your mind works. */
function setZoneCleared(s, zoneId, value) {
  const z = zoneOf(s, zoneId);
  if (z.cleared) restoreCleared(s, z);
  z.removed = null;
  if (value.startsWith('u:')) {
    const unit = s.horde.find(h => h.uid === Number(value.slice(2)));
    if (unit) {
      z.cleared = unit;
      z.removed = unit.bracket || bracketOfRaw(unit.raw);
      destroyUnit(s, unit.uid, -1, 'zone');
    }
  } else if (value.startsWith('b:')) z.removed = value.slice(2);
  rebuildSlots(z, s);
}
function restoreCleared(s, z) {
  const unit = z.cleared;
  s.destroyed = s.destroyed.filter(d => !(d.uid === unit.uid && d.by === 'zone'));
  if (!s.horde.some(h => h.uid === unit.uid)) { s.horde.push(unit); s.horde.sort((a, b) => a.uid - b.uid); }
  z.cleared = null;
}
/* Rules 4: "The first Character model spawned by the Horde acts as the Warlord." Destroyed units count, so the Warlord
   never moves to another unit. Returns { uid, name, alive } or null. */
function hordeWarlord(s = state) {
  const everyUnit = [...s.horde, ...s.destroyed].sort((a, b) => a.uid - b.uid);
  for (const h of everyUnit) {
    const character = entryCharacters(parseEntry(h.raw)).find(c => c.warlordOk);
    if (character) return { uid: h.uid, name: character.name, alive: s.horde.some(x => x.uid === h.uid) };
  }
  return null;
}

/* Redo the current round's spawn: every zone starts over and the units spawned this round are removed.
   Units from earlier rounds stay (a unit cleared from a zone comes back), and extra zones (Pincer Maneuver) are kept as fresh zones. */
function resetSpawn(s) {
  const round = effRound(s);
  s.zones.filter(z => z.cleared).forEach(z => restoreCleared(s, z));
  s.horde = s.horde.filter(h => h.round !== round);
  const extras = s.zones.filter(z => z.extra).length;
  makeZones(s);
  for (let i = 0; i < extras; i++) s.zones.push(newZone(s, true));
  addLog(s, 'Round ' + round + ' spawn reset');
}
const hasSpawnToReset = (s = state) => s.horde.some(h => h.round === effRound(s)) || s.zones.some(z => z.dice || z.removed || z.slots.length);

/* Random pick for a slot, as a draft the player can accept or roll again. Uniform among the possible options that were
   not already turned down for this slot; once every option was turned down the list starts over (never the same twice in a row). */
function drawRandom(s, zoneId, slotId) {
  const z = zoneOf(s, zoneId);
  const slot = z.slots.find(sl => sl.id === slotId);
  if (!slot || slot.filled) return;
  const possible = rankOptions(slot.bracket, z.seed + ':' + slot.id, s).filter(o => o.available).map(o => o.raw);
  const turnedDown = slot.draft;
  slot.rejected = slot.rejected || [];
  if (turnedDown) slot.rejected.push(turnedDown); else slot.rejected = [];
  let pool = possible.filter(raw => !slot.rejected.includes(raw));
  if (!pool.length) { slot.rejected = turnedDown ? [turnedDown] : []; pool = possible.filter(raw => !slot.rejected.includes(raw)); }
  if (!pool.length) pool = possible;
  slot.draft = pool.length ? pool[randInt(pool.length)] : null;
}
function acceptDraft(s, zoneId, slotId) {
  const slot = zoneOf(s, zoneId).slots.find(sl => sl.id === slotId);
  if (!slot || !slot.draft) return;
  const raw = slot.draft;
  pickUnit(s, zoneId, slotId, raw);
  slot.draft = null; slot.rejected = [];
}
function cancelDraft(s, zoneId, slotId) {
  const slot = zoneOf(s, zoneId).slots.find(sl => sl.id === slotId);
  if (slot) { slot.draft = null; slot.rejected = []; }
}
/* Take a spawned unit back off the table and draw another random one for the same slot. */
function replaceUnit(s, zoneId, slotId) {
  const slot = zoneOf(s, zoneId).slots.find(sl => sl.id === slotId);
  if (!slot || !slot.filled) return;
  const i = s.horde.findIndex(h => h.zone === zoneId && h.raw === slot.filled);
  if (i < 0) return;
  const removed = slot.filled;
  s.horde.splice(i, 1);
  slot.filled = null; slot.rejected = []; slot.draft = removed;
  drawRandom(s, zoneId, slotId);
  addLog(s, 'Replaced ' + parseEntry(removed).label + ' ' + bracketLabel(slot.bracket));
}

/* ---- Turn sequence ---- */
function beginRound(s, round) {
  s.round = round; s.stage = 'start';
  s.rnd = s.carry; s.carry = zeroCarry();
  s.ticks = {}; s.manualMod = 0; s.objectives = 0; s.buys = [];
  s.players.forEach(p => { p.spRound = 0; p.lzUsed = false; });
  if (round > 1) makeZones(s);
  addLog(s, 'Round ' + round + ' begins');
}
function startGame(s) {
  s.rnd = zeroCarry(); s.carry = zeroCarry();
  s.round = 1; s.stage = 'start'; s.ticks = {};
  s.players.forEach(p => { p.spRound = 0; p.lzUsed = false; });
  addLog(s, 'Game started');
}
/* The deployment spawn counts as round 1's spawn, so starting round 1 before every zone is done is easy to do by mistake. */
function setupSpawnUnfinished(s = state) {
  return s.stage === 'setup' && s.zones.some(z => ['pending', 'filling'].includes(zoneStatus(z, s).status));
}
function advance(s) {
  if (s.stage === 'setup') { startGame(s); return; }
  if (s.stage === 'over') return;
  const list = stagesFor(s.round, s);
  const i = list.indexOf(s.stage);
  if (i < list.length - 1) { s.stage = list[i + 1]; return; }
  if (s.round >= totalRounds(s)) { s.stage = 'over'; addLog(s, 'Game over'); return; }
  beginRound(s, s.round + 1);
}
function retreat(s) {
  if (s.stage === 'over') { s.stage = 'end'; return; }
  if (s.stage === 'setup') return;
  const list = stagesFor(s.round, s);
  const i = list.indexOf(s.stage);
  if (i > 0) { s.stage = list[i - 1]; return; }
  if (s.round === 1) { s.round = 0; s.stage = 'setup'; }
}
/* The three automatic start-of-round steps. Each runs once per round (the 'auto:' ticks), so a second tap cannot
   reveal extra cards; undo if a step must be redone. */
function stepDiscardMisery(s) {
  if (s.ticks['auto:discard']) return;
  discardActiveMisery(s);
  s.ticks['auto:discard'] = s.ticks['start:0'] = true;
}
function stepRevealMisery(s) {
  if (s.ticks['auto:misery']) return;
  stepDiscardMisery(s);
  s.rnd.force.forEach(id => forceMisery(s, id));
  s.rnd.force = [];
  revealMisery(s, miseryCountThisRound(s));
  s.ticks['auto:misery'] = s.ticks['start:1'] = true;
}
function stepRevealSecondary(s) {
  if (s.ticks['auto:secondary']) return;
  revealSecondary(s);
  s.ticks['auto:secondary'] = s.ticks['start:2'] = true;
}
function runRoundStart(s) {
  stepDiscardMisery(s);
  stepRevealMisery(s);
  stepRevealSecondary(s);
}
const roundStartDone = (s = state) => !!(s.ticks['auto:discard'] && s.ticks['auto:misery'] && s.ticks['auto:secondary']);

/* ============================== RENDERING ============================== */
const TABS = [['turn', 'Turn', '▶'], ['horde', 'Horde', '☠'], ['cards', 'Cards', '▤'], ['players', 'Players', '☻'], ['setup', 'Setup', '⚙']];
const SHOP_TAGS = ['All', 'Tactics', 'Supply', 'Strike', 'Fortify', 'Secondary', 'Spawn'];
const stageText = stage => ({ horde: '☠ ', players: '⚔ ', round: '' }[STAGES[stage].who]) + STAGES[stage].label;
const chip = (text, kind = '') => `<span class="chip ${kind}">${esc(text)}</span>`;
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

function nextLabel(s) {
  if (s.stage === 'setup') return 'Start round 1';
  if (s.stage === 'over') return 'Game over';
  const list = stagesFor(s.round, s);
  const i = list.indexOf(s.stage);
  if (i < list.length - 1) return 'Next: ' + stageText(list[i + 1]);
  return s.round >= totalRounds(s) ? 'Finish game' : 'Start round ' + (s.round + 1);
}
function renderTracker() {
  const s = state;
  const st = STAGES[s.stage];
  const who = st.who === 'horde' ? '☠ Horde turn' : st.who === 'players' ? '⚔ Players turn' : s.stage === 'setup' ? 'Setup' : s.stage === 'over' ? 'Game over' : 'Battle round';
  const total = totalRounds(s);
  const roundText = s.round ? `Round <b>${s.round}</b>${total === Infinity ? ' (no limit)' : ' / ' + total}` : 'Before round 1';
  const list = (s.stage === 'setup' || s.stage === 'over') ? [] : stagesFor(s.round, s);
  const here = list.indexOf(s.stage);
  const pills = list.map((id, i) => `<button class="pill ${STAGES[id].who} ${i < here ? 'done' : ''}" data-act="goto" data-stage="${id}" ${id === s.stage ? 'aria-current="step"' : ''}>${esc(stageText(id))}</button>`).join('');
  const chips = s.players.map(p => `<button class="pchip" data-act="tab" data-tab="players">${esc(p.name)} <span class="cp">CP ${p.cp}</span> <span class="sp">SP ${p.sp}</span></button>`).join('');
  const canBack = !(s.stage === 'setup' || (s.stage === 'start' && s.round > 1));
  return `<div class="tracker">
    <div class="tr-top"><div class="who">${who}</div><div class="round">${roundText}${s.setup.hard ? '<span class="mode-tag">Hard</span>' : ''}</div></div>
    <div class="pchips">${chips}</div>
    <div class="tr-nav"><button class="navbtn" data-act="back" ${canBack ? '' : 'disabled'} aria-label="Previous step">◀</button>
      <button class="navbtn next" data-act="next" ${s.stage === 'over' ? 'disabled' : ''}>${esc(nextLabel(s))} ▶</button>
      <button class="navbtn" data-act="undo" aria-label="Undo last change">↶</button></div>
    ${pills ? `<div class="pills">${pills}</div>` : ''}
  </div>`;
}
function renderTabbar() {
  return TABS.map(([id, label, icon]) => `<button class="tab" role="tab" data-act="tab" data-tab="${id}" aria-selected="${state.tab === id}"><span class="ic" aria-hidden="true">${icon}</span>${label}</button>`).join('');
}

/* ---------- Pieces shared by several tabs ---------- */
function renderItems(stage, items) {
  return '<ul class="items">' + items.map((text, i) => {
    const k = stage + ':' + i;
    const on = !!state.ticks[k];
    return `<li class="item ${on ? 'done' : ''}"><button class="tick" data-act="tick" data-k="${k}" aria-pressed="${on}" aria-label="Mark done">${on ? '✓' : ''}</button><div class="txt">${md(text)}</div></li>`;
  }).join('') + '</ul>';
}
function miseryCard(id, big) {
  const c = MIS[id];
  return `<article class="gcard misery ${big ? 'big' : ''}"><div class="hd"><span class="no">${c.n}</span><span class="nm">${esc(c.name)}</span></div><p>${esc(c.text)}</p></article>`;
}
function secondaryCard(id, big) {
  const c = SEC[id];
  return `<article class="gcard secondary ${big ? 'big' : ''}"><div class="hd"><span class="no">${c.n}</span><span class="nm">${esc(c.name)}</span>${c.verify ? chip('Check wording', 'warn') : ''}</div>
    <div class="lbl">Condition</div><p>${esc(c.cond)}</p><div class="lbl">Reward</div><p>${esc(c.rew)}</p><div class="lbl">Punishment</div><p>${esc(c.pen)}</p></article>`;
}
function secretCard(id) {
  const c = OBJ[id];
  return `<article class="gcard secret"><div class="hd"><span class="no">${c.n}</span><span class="nm">${esc(c.name)}</span></div><p>${esc(c.text)}</p><div class="ft">${c.tags.map(t => chip(t)).join('')}</div></article>`;
}
function faceDown(label) { return `<article class="gcard secret back"><b>${esc(label)}</b><span class="small">hidden</span></article>`; }

function renderInPlay() {
  const s = state;
  if (s.stage === 'setup' || s.stage === 'over') return '';
  const mis = s.decks.misery.active, sec = s.stage === 'end' ? [] : s.decks.secondary.active;

function phaseNotes(h, stage, s = state) {

  const notes = [];

    [p, ...characters].forEach(q => { if (q.command.length) notes.push(q.name + ', Command phase: ' + q.command.join(', ')); });
  } else if (stage === 'h-move') {
    if (inReserves(h, s)) notes.push('In strategic reserves: ingress now, more than 8" from all enemies and as close to a Player unit as possible, not within range of an objective.');
    else if (h.round === effRound(s) && p.scouts) notes.push('Spawned this turn: add Scouts ' + p.scouts + ' to its Move.');
    if (p.noMove) notes.push('Does not move.');

    if (p.allAssault) notes.push('All its guns are [ASSAULT]: Advance when it helps.');
    if (e.placeholders.some(ph => ph.toLowerCase() === 'transported unit')) notes.push('Passengers disembark if an enemy is in range of their guns or it lets them charge (never into a Spawn Zone).');
  } else if (stage === 'h-shoot') {

  }).join('');
  return `<div class="row spread nowrap"><h2>${esc(e.label)}</h2><button class="btn sm" data-act="sheet-close">Close</button></div>${extras}
    ${[e.baseKey, ...e.named.map(entryKey)].map(datasheetHtml).join('')}
    <p class="small muted">Stats, weapons and keywords: ${esc(UNITS.source)} (${esc(UNITS.version)}). Ability text is not copied: read it in your datasheets. "Horde rules" are our reading of Horde Mode rules 3 to 5.</p>`;
}

/* ---------- Horde tab ---------- */
function optionHtml(o, rank, zoneId, slotId) {
  const reasons = o.reasons.map(r => chip(r.text, r.kind)).join('');
  return `<div class="opt ${o.available ? '' : 'na'}"><div class="rk">${rank}</div><div><div class="nm">${unitButton(o.raw, o.entry.label)}</div><div class="reasons">${reasons}</div></div>
    <button class="btn primary sm" data-act="pick" data-z="${zoneId}" data-s="${slotId}" data-raw="${esc(o.raw)}">Spawn</button></div>`;
}
function renderSlot(z, slot) {
  if (slot.filled) {
    const onTable = state.horde.some(h => h.zone === z.id && h.raw === slot.filled);
    return `<div class="slot"><div class="row spread"><span><b>✓ ${esc(bracketLabel(slot.bracket))}</b> ${unitButton(slot.filled, parseEntry(slot.filled).label)}</span>${onTable ? `<button class="btn sm" data-act="replace" data-z="${z.id}" data-s="${slot.id}">🎲 Replace</button>` : ''}</div></div>`;
  }
  const key = z.id + ':' + slot.id;
  const ranked = rankOptions(slot.bracket, z.seed + ':' + slot.id);
  const available = ranked.filter(o => o.available);
  const unavailable = ranked.filter(o => !o.available);
  const open = !!ui.exp[key];
  const lower = BRACKET_KEYS.indexOf(slot.bracket) - 1;
  if (slot.draft) return renderDraft(z, slot, ranked, lower);
  const shown = open ? available : available.slice(0, 3);
  return `<div class="slot"><div class="row spread"><b>Pick 1 unit from ${esc(bracketLabel(slot.bracket))}</b><span class="small muted">${available.length} possible${unavailable.length ? ', ' + unavailable.length + ' missing models' : ''}</span></div>
    ${shown.map((o, i) => optionHtml(o, i + 1, z.id, slot.id)).join('') || '<p class="sub">Nothing in this bracket fits your collection. Roll down or change the Collection on the Setup tab.</p>'}
    <div class="row">${available.length > 3 ? `<button class="btn sm" data-act="exp" data-k="${key}">${open ? 'Show top 3' : 'All ' + available.length + ' options'}</button>`
      : unavailable.length ? `<button class="btn sm" data-act="exp" data-k="${key}">${open ? 'Hide missing models' : 'Show ' + unavailable.length + ' with missing models'}</button>` : ''}
      ${available.length ? `<button class="btn sm" data-act="random" data-z="${z.id}" data-s="${slot.id}">🎲 Random pick</button>` : ''}
      ${lower >= 0 ? `<button class="btn sm" data-act="rolldown" data-z="${z.id}" data-s="${slot.id}">Roll down: 2 × ${esc(bracketLabel(BRACKET_KEYS[lower]))}</button>` : ''}</div>
    ${open && unavailable.length ? `<div class="sub">Missing models:</div>${unavailable.map(o => optionHtml(o, '–', z.id, slot.id)).join('')}` : ''}</div>`;
}
/* A random pick waiting for a decision: spawn it, or roll again. */
function renderDraft(z, slot, ranked, lower) {
  const pick = ranked.find(o => o.raw === slot.draft);
  const label = pick ? pick.entry.label : parseEntry(slot.draft).label;
  const reasons = pick ? pick.reasons.map(r => chip(r.text, r.kind)).join('') : '';
  const turnedDown = (slot.rejected || []).length;
  const ids = `data-z="${z.id}" data-s="${slot.id}"`;
  return `<div class="slot"><div class="row spread"><b>Pick 1 unit from ${esc(bracketLabel(slot.bracket))}</b><span class="small muted">random pick</span></div>
    <div class="draft"><div class="row spread"><span class="small muted">🎲 Drawn at random</span><span class="small muted">${turnedDown ? 'turned down ' + turnedDown : 'first draw'}</span></div>
      <div class="nm" style="font-size:17px">${unitButton(slot.draft, label)}</div><div class="reasons">${reasons}</div>
      <div class="row"><button class="btn primary" data-act="draft-accept" ${ids}>Spawn this</button><button class="btn" data-act="random" ${ids}>🎲 Roll again</button></div></div>
    <div class="row"><button class="btn sm" data-act="draft-cancel" ${ids}>Back to ranked options</button>
      ${lower >= 0 ? `<button class="btn sm" data-act="rolldown" ${ids}>Roll down: 2 × ${esc(bracketLabel(BRACKET_KEYS[lower]))}</button>` : ''}</div></div>`;
}
function renderZone(z, index) {
  const s = state;
  const { result, status } = zoneStatus(z);
  const anyFilled = z.slots.some(sl => sl.filled);
  const needed = diceNeeded();
  const label = z.extra ? 'Pincer Maneuver (reserves)' : 'Spawn Zone ' + (index + 1);
  const badge = { noroll: chip('No roll this round', 'bad'), pending: chip('Roll needed', 'warn'), none: chip('Nothing spawns', 'bad'), filling: chip('Pick units', 'good'), done: chip('Done', '') }[status];
  const dice = Array.from({ length: needed }, (_, i) => `<select class="die" data-change="die" data-z="${z.id}" data-i="${i}" aria-label="Die ${i + 1}" ${anyFilled ? 'disabled' : ''}><option value="0">–</option>${[1, 2, 3, 4, 5, 6].map(v => `<option value="${v}" ${z.dice && z.dice[i] === v ? 'selected' : ''}>${v}</option>`).join('')}</select>`).join('');
  /* Rules 4 step 2: Horde units from earlier rounds that could still stand in this zone, plus a by-bracket fallback. */
  const clearable = [...(z.cleared ? [z.cleared] : []), ...s.horde.filter(h => h.round < effRound(s))];
  const unitOption = h => { const b = h.bracket || bracketOfRaw(h.raw); return `<option value="u:${h.uid}" ${z.cleared && z.cleared.uid === h.uid ? 'selected' : ''}>${esc(parseEntry(h.raw).label)} ${b ? bracketLabel(b) + ' (+' + BRACKET_MIN[b] + ')' : ''}${h.zoneNo ? ', spawned in zone ' + h.zoneNo : ''}</option>`; };
  /* Nothing can stand in a zone before round 2 (the first spawn is at deployment); a filled zone keeps showing what it cleared. */
  const showClear = !z.extra && (z.cleared || z.removed || (!anyFilled && effRound(s) > 1));
  const removedOptions = `<option value="">Nothing in the zone</option>`
    + (clearable.length ? `<optgroup label="Horde units on the table">${clearable.map(unitOption).join('')}</optgroup>` : '')
    + `<optgroup label="Another unit, by its bracket">${BRACKET_KEYS.map(k => `<option value="b:${k}" ${!z.cleared && z.removed === k ? 'selected' : ''}>${bracketLabel(k)} (+${BRACKET_MIN[k]})</option>`).join('')}</optgroup>`;
  let calc;
  if (result.complete) {
    const modText = result.mods.length ? result.mods.map(m => esc(m.label) + ' ' + signed(m.val)).join(', ') : 'no modifiers';
    calc = `<div class="calc">${needed === 3 ? '3D6 keep best 2' : '2D6'}: ${esc(z.dice.join(' + '))}${needed === 3 ? ' (lowest dropped)' : ''} = ${result.unmodified} <span class="muted small">(${modText})</span> → <span class="total">${result.total}</span> ${result.bracket ? esc(bracketLabel(result.bracket)) : ''}</div>${result.none ? `<p class="note bad">${esc(result.reason)}</p>` : ''}`;
  } else if (!result.noRolls) {
    const mods = result.mods.length ? result.mods.map(m => esc(m.label) + ' ' + signed(m.val)).join(', ') : 'no modifiers';
    calc = `<p class="sub">Modifiers: ${mods} (total ${signed(result.sum)}).</p>`;
  } else calc = `<p class="note">Hard Mode final round: the Horde does not spawn.</p>`;
  return `<div class="zone ${status === 'done' || status === 'none' ? 'done' : ''}"><div class="row spread"><h3>${esc(label)}</h3>${badge}</div>
    ${result.noRolls ? calc : `${showClear ? `<label class="field"><span><b>Clear the zone first</b>: every unit in it is destroyed, Player units too. A Horde unit adds its bracket's lowest roll.</span>
      <select data-change="removed" data-z="${z.id}" ${anyFilled ? 'disabled' : ''}>${removedOptions}</select></label>` : ''}
      <div class="dice"><span class="small muted">${needed}D6</span>${dice}${anyFilled ? '' : result.complete ? `<button class="btn sm" data-act="rollzone" data-z="${z.id}">🎲 Re-roll</button>` : `<button class="btn sm primary" data-act="rollzone" data-z="${z.id}">🎲 Roll for me</button>`}</div>
      ${calc}${z.slots.map(sl => renderSlot(z, sl)).join('')}`}</div>`;
}
function renderHorde() {
  const s = state;
  const r = effRound();
  const rr = roundRules(r);
  const standardHint = s.setup.sheet === 'standard' ? `<p class="sub">On the Standard sheet "+ Leader" or "+ Support" means any leader or support that can attach. "+ Transported Unit" means any unit that fits (a full squad, or a half squad with a leader, works well). Switch to the Detailed sheet on the Setup tab for named options.</p>` : '';
  const reserveNote = (r >= 2 && r <= 4) ? `<p class="note">Rounds 2 to 4: a spawned unit with Deep Strike does not go on the table. It waits in the Horde's strategic reserves and makes an ingress move in the Horde Movement phase.</p>` : '';
  const helpOpen = !!ui.exp.hordehelp;
  const bracketHint = rr.spawn === null ? '' : `<p class="small muted">Rolling 10 or more uses the [10+] bracket${s.setup.allow13 ? ', 13 or more the [13+] bracket' : ' (the [13+] bracket is off: turn it on in Setup)'}. An unmodified 2 spawns nothing. You may always roll down: place two units from the bracket below instead.</p>`;
  const header = `<section class="panel turnbar"><div class="row spread nowrap"><h2>Spawn the Horde</h2><span class="chip">Round ${r}</span></div>
    <div class="row spread"><div class="row nowrap"><span class="small"><b>Modifier</b> <span class="muted">(manual)</span></span>
      <div class="stepper"><button data-act="manual" data-d="-1" aria-label="Lower modifier">−</button><span class="num">${signed(s.manualMod) || '0'}</span><button data-act="manual" data-d="1" aria-label="Raise modifier">+</button></div></div>
      <div class="row nowrap"><button class="btn sm danger" data-act="sheet" data-type="resetspawn" ${hasSpawnToReset() ? '' : 'disabled'}>Redo spawn</button>
      <button class="btn sm" data-act="exp" data-k="hordehelp">${helpOpen ? 'Hide hints' : 'Hints'}</button></div></div>
    ${activeMisery('m07') ? '<p class="note bad">Unlucky Night is active: roll 3D6 and discard the lowest.</p>' : ''}
    ${helpOpen ? `<p class="small muted">Spawn table: ${esc(FACTION.name)} ${esc(s.setup.sheet)} sheet (DigitalBeef, updated ${esc(SPAWN.updated)}). Zones can be done in any order. Tap a unit name for its datasheet and Horde rules.</p>` + bracketHint + standardHint + reserveNote : ''}
    <details><summary>Placing spawned units (rules 4, step 5)</summary><ul class="bul small">
      <li>Set the unit up in its Spawn Zone, as close to the front of the deployment zone as possible. If it does not fit, it may spill into No Man's Land.</li>
      <li>Ignore distance limits to enemy units: it may be set up within Engagement Range, and then counts as having charged this turn.</li>
      <li>A spawned unit counts as having been on the table since the start of the game (it did not "arrive" this round).</li>
      <li>Rounds 2 to 4: a unit with Deep Strike goes into strategic reserves instead and ingresses in the Horde Movement phase.</li>
      <li>The first CHARACTER the Horde spawns is its Warlord.</li></ul></details></section>`;
  const zones = s.zones.map((z, i) => renderZone(z, i)).join('');
  const wl = hordeWarlord();
  const roster = `<section class="panel"><h2>On the table (${s.horde.length})</h2>
    ${s.horde.length ? `<div class="roster">${s.horde.map(h => `<div class="rost"><div class="grow"><div>${unitButton(h.raw, parseEntry(h.raw).label)}</div><div class="small muted">round ${h.round}${h.zoneNo ? ', zone ' + h.zoneNo : h.zoneNo === 0 ? ', Pincer Maneuver' : ''}${h.bracket ? ', ' + bracketLabel(h.bracket) : ''}</div><div class="reasons">${unitChips(h)}</div></div><button class="btn sm" data-act="sheet" data-type="destroy" data-uid="${h.uid}">Destroyed</button></div>`).join('')}</div>` : '<p class="sub">No Horde units on the table yet.</p>'}
    ${wl && !wl.alive ? `<p class="small muted">The Horde Warlord (${esc(wl.name)}) was destroyed.</p>` : ''}
    <p class="sub">Tap Destroyed when a unit dies: the player who killed it gains 1 SP. Its models then count as free again in your collection. Tap a name for its datasheet and Horde rules.</p></section>`;
  return header + zones + roster;
}

/* ---------- Cards tab ---------- */
function renderCards() {

  const counts = d => chip('Deck ' + d.draw.length) + chip('Active ' + d.active.length, d.active.length ? 'good' : '') + chip('Discard ' + d.discard.length);
  const misery = `<section class="panel"><h2>Misery deck</h2>
    <div class="row">${counts(m)}</div>

  const secondary = `<section class="panel"><h2>Secondary Missions</h2>

    ${refSec ? `<div class="cards">${SECONDARY.map(c => secondaryCard(c.id)).join('')}</div>` : ''}</section>`;
  return misery + secondary + reference;
}

/* ---------- Players tab ---------- */
function renderSecretArea(p, i) {
  if (state.setup.rounds === 'inf') return '<p class="sub">No Secret Objectives in an infinite game.</p>';
  const sec = p.secret;
  const peeking = ui.peek === i;
  const peekButton = `<button class="btn sm" data-act="peek" data-i="${i}">Peek (only ${esc(p.name)} looks)</button>`;
  if (sec.choices.length) {
    return `<p class="small muted">Pick 1 to keep. The others go back into the deck.</p>
      <div class="cards">${sec.choices.map(id => peeking ? `<div>${secretCard(id)}<button class="btn primary sm" style="margin-top:6px" data-act="keep" data-i="${i}" data-id="${id}">Keep this one</button></div>` : faceDown('Secret Objective')).join('')}</div>
      ${peeking ? `<button class="btn sm" data-act="hide">Hide cards</button>` : peekButton}`;
  }
  if (sec.kept) {
    if (sec.revealed) return `<div class="cards">${secretCard(sec.kept)}</div>${chip('Revealed', 'good')}`;
    return `<div class="cards">${peeking ? secretCard(sec.kept) : faceDown('Your Secret Objective')}</div>
      <div class="row">${peeking ? `<button class="btn sm" data-act="hide">Hide</button>` : peekButton}<button class="btn sm danger" data-act="sheet" data-type="reveal" data-i="${i}">Reveal to everyone</button></div>`;
  }
  return `<p class="sub">Not dealt yet. Deal them in the Setup step on the Turn tab.</p>`;
}

      <div class="row spread"><div class="row"><span class="small muted">CP</span><div class="stepper cp"><button data-act="cp" data-i="${i}" data-d="-1" aria-label="Spend CP">−</button><span class="num">${p.cp}</span><button data-act="cp" data-i="${i}" data-d="1" aria-label="Gain CP">+</button></div></div>
      <div class="row"><span class="small muted">SP</span><div class="stepper sp"><button data-act="sp" data-i="${i}" data-d="-1" aria-label="Spend SP">−</button><span class="num">${p.sp}</span><button data-act="sp" data-i="${i}" data-d="1" aria-label="Gain SP">+</button></div></div></div>

    <section class="panel"><h2>About</h2>
      <p class="small">Horde Mode 11th Edition v0.9 by The Poorhammer Podcast. Spawn brackets courtesy of DigitalBeef (sheet updated ${esc(SPAWN.updated)}). Unit stats, weapons and keywords from ${esc(UNITS.source)} (${esc(UNITS.version)}). Card and rules text is summarised in our own words: check the source documents for exact wording.</p>
      <button class="btn danger" data-act="sheet" data-type="newgame">New game</button></section>`;
}

/* ---------- Modal sheet ---------- */
function renderSheet() {
  const sh = ui.sheet;
  if (!sh) return '';
  const s = state;
  let inner = '';
  if (sh.type === 'newgame') {
    inner = `<h2>Start a new game?</h2><p>This clears the decks, SP, CP and Horde. Your settings and collection are kept.</p><div class="row"><button class="btn danger" data-act="newgame-do">New game</button><button class="btn" data-act="sheet-close">Cancel</button></div>`;
  } else if (sh.type === 'destroy') {
    const unit = s.horde.find(h => h.uid === sh.uid);
    if (!unit) { ui.sheet = null; return ''; }
    inner = `<h2>${esc(parseEntry(unit.raw).label)} destroyed</h2><p>Which player gets 1 SP for the kill?</p><div class="row">${s.players.map((p, i) => `<button class="btn primary" data-act="destroy-by" data-i="${i}">${esc(p.name)}</button>`).join('')}<button class="btn" data-act="destroy-by" data-i="-1">Nobody</button></div><button class="btn" data-act="sheet-close">Cancel</button>`;
  } else if (sh.type === 'share') {
    inner = `<h2>Share Supplies</h2><p>${esc(s.players[sh.pi].name)} pays 3 SP and gives 2 SP to:</p><div class="row">${s.players.map((p, i) => i === sh.pi ? '' : `<button class="btn primary" data-act="share-do" data-to="${i}">${esc(p.name)}</button>`).join('')}</div><button class="btn" data-act="sheet-close">Cancel</button>`;
  } else if (sh.type === 'startearly') {
    inner = `<h2>Start round 1 without the first spawn?</h2><p>Some Spawn Zones are not rolled or not filled yet. The deployment spawn counts as round 1's spawn.</p><div class="row"><button class="btn danger" data-act="startearly-do">Start anyway</button><button class="btn" data-act="sheet-close">Back</button></div>`;
  } else if (sh.type === 'resetspawn') {
    const count = s.horde.filter(h => h.round === effRound(s)).length;
    inner = `<h2>Redo this round's spawn?</h2><p>This clears every Spawn Zone (dice, cleared-unit choices and picks)${count ? ' and removes the ' + count + ' Horde unit' + (count === 1 ? '' : 's') + ' spawned this round' : ''}. Units from earlier rounds stay. The ↶ button undoes it.</p><div class="row"><button class="btn danger" data-act="resetspawn-do">Redo spawn</button><button class="btn" data-act="sheet-close">Cancel</button></div>`;
  } else if (sh.type === 'reveal') {
    const p = s.players[sh.i];
    inner = `<h2>Reveal ${esc(p.name)}'s Secret Objective?</h2><p>Everyone will see it. Only do this when the card tells you to, or at the end of the game.</p><div class="row"><button class="btn danger" data-act="reveal-do" data-i="${sh.i}">Reveal</button><button class="btn" data-act="sheet-close">Cancel</button></div>`;
  } else if (sh.type === 'unit') {
    inner = renderUnitSheet(sh.raw);
  } else if (sh.type === 'secwho') {
    const c = SEC[sh.id];
    inner = `<h2>${esc(c.name)} succeeded</h2><p class="small">${esc(c.rew)}</p><p>Which player's unit triggered it? If several did, pick one of them at random.</p>
      <div class="row">${s.players.map((p, i) => `<button class="btn primary" data-act="secwho-do" data-i="${i}">${esc(p.name)}</button>`).join('')}${c.rewFx.nobody ? `<button class="btn" data-act="secwho-do" data-i="-1">Nobody (+2 SP each instead)</button>` : ''}</div><button class="btn" data-act="sheet-close">Cancel</button>`;
  } else if (sh.type === 'replace') {
    inner = `<h2>Advanced Tactics: replace which mission?</h2><div class="cards">${s.decks.secondary.active.map(id => `<div>${secondaryCard(id)}<button class="btn primary sm" style="margin-top:6px" data-act="sec-redraw" data-id="${id}">Replace this one</button></div>`).join('')}</div><button class="btn" data-act="sheet-close">Later (use the Cards tab)</button>`;
  } else if (sh.type === 'perk') {
    const sv = s.saved[sh.idx];
    if (!sv) { ui.sheet = null; return ''; }
    const perk = perkOf(sv);
    const owner = s.players[sv.owner];
    let body;
    if (!perk) body = `<p>${esc(SEC[sv.id].rew)}</p>`;
    else if (perk.cancelMisery) {
      const active = s.decks.misery.active;
      body = active.length ? `<div class="cards">${active.map(id => `<div>${miseryCard(id)}<button class="btn primary sm" style="margin-top:6px" data-act="perk-cancel" data-mid="${id}">Cancel this card</button></div>`).join('')}</div><p class="small muted">One-off effects that already happened (lost SP, extra cards) stay: undo them by hand if you agree to.</p>` : '<p class="sub">No Misery card is active right now.</p>';
    } else if (perk.discount) {
      const item = SHOP[perk.item];
      const reason = shopCheck(s, item, sv.owner, 0, { discount: perk.discount });
      body = `<div class="row"><button class="btn primary" data-act="perk-discount" ${reason ? 'disabled' : ''}>Buy ${esc(item.name)} for ${Math.max(0, shopPrice(s, item, sv.owner, 0) - perk.discount)} SP</button></div>${reason ? `<p class="small" style="color:var(--bad)">${esc(reason)}</p>` : ''}`;
    } else {
      const items = (perk.tag ? RESUPPLY.filter(it => it.tags.includes(perk.tag)) : [SHOP[perk.item]]);
      body = `<div class="roster">${items.map(it => {
        const x = it.price === 'X' ? (Number(s.secX['shop:' + it.id]) || 1) : 0;
        const reason = shopCheck(s, it, sv.owner, x, { free: true });
        const buttons = it.auto === 'share' ? s.players.map((p, i) => i === sv.owner ? '' : `<button class="btn primary sm" data-act="perk-free" data-item="${it.id}" data-to="${i}" ${reason ? 'disabled' : ''}>Give ${esc(p.name)} 2 SP</button>`).join('')
          : `<button class="btn primary sm" data-act="perk-free" data-item="${it.id}" ${reason ? 'disabled' : ''}>Take free${it.price === 'X' ? ' (X=' + x + ')' : ''}</button>`;
        return `<div class="rost"><div class="grow"><b>${esc(it.name)}</b>${reason ? `<div class="small" style="color:var(--bad)">${esc(reason)}</div>` : ''}</div><div class="row">${buttons}</div></div>`;
      }).join('')}</div>${items.some(it => it.price === 'X') ? '<p class="small muted">X comes from the X box in the shop.</p>' : ''}`;
    }
    inner = `<h2>${esc(SEC[sv.id].name)}</h2><p><b>${esc(owner.name)}:</b> ${esc(perk ? perkLabel(perk) : 'saved reward')}${sv.left != null ? ' (' + sv.left + ' left)' : ''}. Normally used in a Resupply step.</p>${body}
      <div class="row"><button class="btn danger sm" data-act="perk-drop">Discard it unused</button><button class="btn" data-act="sheet-close">Close</button></div>`;
  }
  return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
}

function render() {
  useFaction(state.setup.faction);
  document.title = FACTION.name + ' Horde Mode 40K';
  const root = document.documentElement;
  if (state.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', state.theme);
  document.body.dataset.who = whoNow();
  const views = { turn: renderTurn, horde: renderHorde, cards: renderCards, players: renderPlayers, setup: renderSetup };
  $('#tracker').innerHTML = renderTracker();
  $('#main').innerHTML = (views[state.tab] || renderTurn)();
  $('#tabbar').innerHTML = renderTabbar();
  $('#sheet-root').innerHTML = renderSheet();
}

/* ============================== EVENTS ============================== */
/* The Horde faction can change during setup until a Horde unit has spawned: zones keep their dice, picks start over. */
const factionLocked = (s = state) => s.stage !== 'setup' || s.horde.length > 0 || s.destroyed.length > 0;
function applySetup(s, key, value) {
  const locked = s.stage !== 'setup';
  if (['points', 'players', 'rounds', 'hard'].includes(key) && locked) return;
  if (key === 'faction') {
    if (factionLocked(s) || !FACTIONS[value] || value === s.setup.faction) return;
    s.setup.faction = useFaction(value);
    s.zones.forEach(z => rebuildSlots(z, s));
    addLog(s, 'Horde faction: ' + FACTION.name);
  } else if (key === 'points') { s.setup.points = Number(value); makeZones(s); }
  else if (key === 'players') { s.setup.players = Number(value); syncPlayers(s); resetSecrets(s); }
  else if (key === 'rounds') s.setup.rounds = value === 'inf' ? 'inf' : Number(value);
  else if (key === 'hard') s.setup.hard = value === '1';
  else if (key === 'sheet') s.setup.sheet = value;
  else if (key === 'allow13') s.setup.allow13 = value === '1';
  else if (key === 'excludeTraitor') { s.setup.excludeTraitor = value === '1'; if (!locked) resetSecrets(s); }
}
/* The Secret Objective deck depends on the player count and the Traitor switch. Changing either during setup takes back
   any dealt cards, so they can be dealt again from the right deck. */
function resetSecrets(s) {
  const wasDealt = s.secretDealt;
  s.decks.secret = buildDecks(s).secret;
  s.players.forEach((p, i) => { p.secret = newPlayer(i).secret; });
  s.secretDealt = false;
  if (wasDealt) addLog(s, 'Secret Objectives taken back: deal them again');
}
function setTab(tab) {
  state.tab = tab; ui.peek = null;
  store.set(JSON.stringify(state));
  render();
  window.scrollTo(0, 0);
}
/* Changes that are not worth an undo step (ticks, typing a name). */
function quiet(change) {
  change(state);
  store.set(JSON.stringify(state));
  render();
}

const ACTIONS = {
  tab: d => setTab(d.tab),
  next: () => { if (setupSpawnUnfinished()) { ui.sheet = { type: 'startearly' }; render(); } else mutate(advance); },
  'startearly-do': () => { ui.sheet = null; mutate(advance); },
  back: () => mutate(retreat),
  undo: () => undo(),
  goto: d => mutate(s => { s.stage = d.stage; }),
  tick: d => quiet(s => { s.ticks[d.k] = !s.ticks[d.k]; }),
  deal: () => mutate(dealSecrets),
  roundstart: () => mutate(runRoundStart),
  'r-discard': () => mutate(stepDiscardMisery),
  'r-misery': () => mutate(stepRevealMisery),
  'r-secondary': () => mutate(stepRevealSecondary),
  'm-draw': () => mutate(s => revealMisery(s, 1)),
  'm-discard': () => mutate(discardActiveMisery),
  's-draw': () => mutate(s => { revealSecondary(s); }),
  obj: d => quiet(s => { s.objectives = Math.max(0, s.objectives + Number(d.d)); }),
  income: () => mutate(s => { gainAll(s, s.objectives + (s.standing.fob ? 1 : 0)); s.ticks['p-command:2'] = true; addLog(s, 'SP income: ' + (s.objectives + (s.standing.fob ? 1 : 0)) + ' each'); }),
  'sec-ok': d => {
    const card = SEC[d.id];
    const problem = xProblem(card, missionX(state, d.id));
    if (problem) { toast(problem); return; }
    if ((rewardNeedsPlayer(card) && state.players.length > 1) || card.rewFx.nobody) { ui.sheet = { type: 'secwho', id: d.id }; render(); return; }
    mutate(s => resolveSecondary(s, d.id, true, missionX(s, d.id), 0));
    toast(card.name + ' succeeded. Reward: ' + card.rew);
  },
  'secwho-do': d => {
    const id = ui.sheet.id;
    ui.sheet = null;
    mutate(s => resolveSecondary(s, id, true, missionX(s, id), Number(d.i)));
    toast(SEC[id].name + ' succeeded. Reward: ' + SEC[id].rew);
  },
  'sec-fail': d => { const card = SEC[d.id]; mutate(s => resolveSecondary(s, d.id, false, missionX(s, d.id))); toast(card.name + ' failed. Punishment: ' + card.pen); },
  'sec-drop': d => mutate(s => discardSecondary(s, d.id)),
  'sec-redraw': d => { ui.sheet = null; mutate(s => redrawSecondary(s, d.id)); },
  manual: d => quiet(s => { s.manualMod += Number(d.d); }),
  rollzone: d => mutate(s => rollZone(s, d.z)),
  pick: d => mutate(s => pickUnit(s, d.z, Number(d.s), d.raw)),
  random: d => {
    const z = zoneOf(state, d.z);
    const slot = z.slots.find(sl => sl.id === Number(d.s));
    if (!rankOptions(slot.bracket, z.seed + ':' + slot.id).some(o => o.available)) { toast('No available option in this bracket'); return; }
    mutate(s => drawRandom(s, d.z, Number(d.s)));
  },
  'draft-accept': d => mutate(s => acceptDraft(s, d.z, Number(d.s))),
  'draft-cancel': d => mutate(s => cancelDraft(s, d.z, Number(d.s))),
  replace: d => mutate(s => replaceUnit(s, d.z, Number(d.s))),
  rolldown: d => mutate(s => rollDownSlot(s, d.z, Number(d.s))),
  exp: d => { ui.exp[d.k] = !ui.exp[d.k]; render(); },
  'coll-remove': d => quiet(s => { delete s.collection[d.key]; }),
  sheet: d => { ui.sheet = { type: d.type, uid: Number(d.uid), i: Number(d.i), idx: Number(d.idx), raw: d.raw, id: d.id }; render(); },
  'sheet-close': (d, el, e) => { if (e.target !== el) return; ui.sheet = null; render(); },
  'resetspawn-do': () => { ui.sheet = null; mutate(resetSpawn); },
  'destroy-by': d => { const uid = ui.sheet.uid; ui.sheet = null; mutate(s => destroyUnit(s, uid, Number(d.i))); },
  buyer: d => quiet(s => { s.buyer = Number(d.i); }),
  shoptag: d => { ui.shopTag = d.tag; render(); },
  buy: d => {
    const item = SHOP[d.id];
    const pi = Math.min(state.buyer, state.players.length - 1);
    const x = item.price === 'X' ? (Number(state.secX['shop:' + item.id]) || 1) : 0;
    const reason = shopCheck(state, item, pi, x);
    if (reason) { toast(reason); return; }
    if (item.auto === 'share') { ui.sheet = { type: 'share', pi, id: item.id }; render(); return; }
    mutate(s => { payFor(s, item, pi, x); completePurchase(s, item, pi); });
    if (item.auto === 'replace-secondary' && state.decks.secondary.active.length > 1) { ui.sheet = { type: 'replace' }; render(); return; }
    toast(item.auto === 'plans' ? 'Bought. Open the Players tab to choose a Secret Objective.' : 'Bought ' + item.name + '. ' + item.text);
  },
  'perk-free': d => {
    const idx = ui.sheet.idx;
    const sv = state.saved[idx];
    const item = SHOP[d.item];
    const x = item.price === 'X' ? (Number(state.secX['shop:' + item.id]) || 1) : 0;
    const reason = shopCheck(state, item, sv.owner, x, { free: true });
    if (reason) { toast(reason); return; }
    mutate(s => useSavedFree(s, idx, item.id, x, Number(d.to)));
    if (!state.saved.includes(sv)) ui.sheet = null;
    if (item.auto === 'replace-secondary' && state.decks.secondary.active.length > 1) ui.sheet = { type: 'replace' };
    render();
    toast(item.name + ' taken free. ' + item.text);
  },
  'perk-discount': () => { const idx = ui.sheet.idx; ui.sheet = null; mutate(s => useSavedDiscount(s, idx)); },
  'perk-cancel': d => { const idx = ui.sheet.idx; ui.sheet = null; mutate(s => useSavedCancel(s, idx, d.mid)); },
  'perk-drop': () => { const idx = ui.sheet.idx; ui.sheet = null; mutate(s => { const sv = spendSaved(s, idx); addLog(s, s.players[sv.owner].name + ' discarded ' + SEC[sv.id].name + ' unused'); }); },
  'share-do': d => { const { pi, id } = ui.sheet; ui.sheet = null; mutate(s => { payFor(s, SHOP[id], pi, 0); gainSP(s, Number(d.to), 2); }); },
  unstand: d => mutate(s => { if (STANDING_COUNTED[d.k]) { s.standing[d.k] -= 1; if (s.standing[d.k] <= 0) delete s.standing[d.k]; } else delete s.standing[d.k]; }),
  cp: d => mutate(s => { const p = s.players[Number(d.i)]; p.cp = Math.max(0, p.cp + Number(d.d)); }),
  sp: d => mutate(s => { const i = Number(d.i); if (Number(d.d) > 0) gainSP(s, i, 1); else s.players[i].sp = Math.max(0, s.players[i].sp - 1); }),
  peek: d => { ui.peek = Number(d.i); clearTimeout(ui.peekTimer); ui.peekTimer = setTimeout(() => { ui.peek = null; render(); }, 10000); render(); },
  hide: () => { ui.peek = null; render(); },
  keep: d => { ui.peek = null; mutate(s => keepSecret(s, Number(d.i), d.id)); },
  'reveal-do': d => { ui.sheet = null; ui.peek = null; mutate(s => { const p = s.players[Number(d.i)]; p.secret.revealed = true; addLog(s, p.name + ' revealed ' + OBJ[p.secret.kept].name); }); },
  set: d => mutate(s => applySetup(s, d.k, d.v)),
  theme: d => quiet(s => { s.theme = d.v; }),
  'newgame-do': () => { state = freshGame({ setup: state.setup, collection: state.collection, theme: state.theme }); undoStack.length = 0; ui.sheet = null; ui.peek = null; store.set(JSON.stringify(state)); render(); window.scrollTo(0, 0); },
};
ui.exp = {};
ui.shopTag = 'All';

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const action = ACTIONS[el.dataset.act];
  if (action) action(el.dataset, el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const d = el.dataset;
  const number = Number(el.value);
  switch (d.change) {
    case 'die': mutate(s => setDie(s, d.z, Number(d.i), number)); break;
    case 'removed': mutate(s => setZoneCleared(s, d.z, el.value)); break;
    case 'shopx': quiet(s => { s.secX['shop:' + d.id] = Math.max(1, Math.floor(number) || 1); }); break;
    case 'secx': quiet(s => { s.secX[d.id] = Math.max(0, Math.floor(number) || 0); }); break;
    case 'pname': quiet(s => { s.players[Number(d.i)].name = el.value.trim() || 'Player ' + (Number(d.i) + 1); }); break;
    case 'coll': quiet(s => { const models = Math.floor(number); if (models > 0) s.collection[d.key] = models; else delete s.collection[d.key]; }); break;
    case 'coll-add': {
      const key = el.value;
      if (!key) break;
      quiet(s => { s.collection[key] = Math.max(1, ...tableSizes(key)); });
      const input = [...document.querySelectorAll('input[data-change="coll"]')].find(i => i.dataset.key === key);
      if (input) { input.focus(); input.select(); }
      break;
    }
    default: break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); }
});

render();
</script>
</body>
</html>
